# SPW-FILE-001 — mass file download. Logic source: coverage.yaml ("At least 30 FileDownloaded /
# FileSyncDownloadedFull records by one user within 15 minutes"). The first shipped rule that uses
# the `threshold:` block: the hits are every download record of a qualifying window.
id: SPW-FILE-001
title: Mass file download
version: 1
status: stable
severity: medium
confidence: medium
mitre: [T1530]
tags: [bec, exfiltration, files]
requires: []
requires_evidence: [ual]
source: ual_events
match:
  operation: {in: [FileDownloaded, FileSyncDownloadedFull]}
threshold:
  group_by: [actor_upn]
  window: 15m
  count: ">= 30"
group_by: [actor_upn]
analyst_guidance: |
  Dozens of downloads within minutes is a script or a sync client copying a library, not a person
  reading documents. Check the client IP and user agent, the site the files came from, and whether
  the same user signed in from a hosting provider shortly before.
false_positives:
  - A user who syncs a document library to a new laptop with the OneDrive client.
  - A migration or backup tool running under the user's account.
references:
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
author: Sparrow
tests:
  - name: thirty downloads in under fifteen minutes
    records:
      - table: ual_events
        operation: FileDownloaded
        user_upn: alice@contoso.example
        event_time: "2026-03-01T10:00:00Z"
