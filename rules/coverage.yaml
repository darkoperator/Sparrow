# Detection coverage matrix for the spec §8.5 seed rule pack (Phase 5 defines the rules'
# ids, intended logic and test storylines; Phase 6 implements them).
#
# Per rule:
#   logic             what the rule must match (Phase 6 implements exactly this)
#   tables            evidence tables the rule reads (the first is where a hit lands)
#   requires          capability ids (data/capabilities.yaml): a tenant where one is
#                     not_licensed gets `not_applicable`
#   requires_evidence evidence ids (profile::availability): `not_licensed` / `not_enabled`
#                     there also gives `not_applicable`
#   needs_geoip       the rule needs ip_intel ASN / geo (ingest with --geoip-dir)
#   min_signin_users  the rule needs sign-ins of at least this many distinct users (a population
#                     threshold); fewer gives `not_applicable` with the reason
#   collectors        collectors that can supply the evidence of a positive (sparrow synth
#                     coverage flags a listed collector no built-in scenario exercises)
#   kind_collectors   per positive kind, the collectors that can supply THAT kind's evidence when
#                     fewer than `collectors` (e.g. a session replay needs a session id)
#   lookalike_collectors  collectors that can supply a look-alike's evidence, when fewer
#                     (Hawk only sees activity from the IPs and users the analyst searched)
#   evidence_all_of   evidence halves a storyline must reach for a hit/no_hit to count: an
#                     optional list of groups, each a list of tables; any table in a group
#                     satisfies that group. Absent means one group equal to `tables`. Set it for
#                     rules whose logic correlates two kinds of evidence (Phase 6 checks the
#                     timing/actor correlation itself; this only checks the evidence is present).
#   positives         storyline kinds that must trigger the rule
#   lookalikes        storyline kinds that must not trigger it
#   correlation_negatives  required for every rule with `evidence_all_of`: look-alike kinds (also
#                     listed under `lookalikes`) whose storyline delivers BOTH evidence halves but
#                     fails the rule's time or actor condition. `sparrow synth coverage` reports
#                     the gap "correlated rule has no correlation negative" without one.
#   computed          storyline kinds whose outcome for the rule depends on generated facts (a
#                     seeded location, a collector's session ids, a preceding sign-in): per tree the
#                     generator evaluates the rule's logic (`condition`, sparrow-synth `oracle`) over
#                     the rows that tree delivers and writes `hit` or `no_hit`, which the detection
#                     gate checks exactly. Each entry names the `kind`, the `condition` and a
#                     `reason`. A kind is never both computed and a positive or look-alike. Every
#                     computed kind must compute a `hit`, confirmed by the gate, on at least one
#                     built-in tree (the heavy seeds 1-3 test); an exception declares
#                     `never_hits: "<why no built-in tree can>"`.
#   baseline_allow    optional exceptions to the detection gate's baseline rule (`sparrow synth
#                     check`): every finding of a rule must cite a storyline whose expected
#                     outcome is `hit`. A finding that cites only records of a kind listed here
#                     (`kind:` a storyline kind, or `baseline` for background activity) is
#                     tolerated. Each entry needs a `reason` and a ruling; prefer `computed`, which
#                     checks exactly. The shipped file has none.
# Rules SPW-HAWK-001..015 cover every Hawk 4.0 investigate condition (research
# 2026-09-26-phase5-hawk-layouts.md §6, H01-H15) plus the two content-derived ones.
version: 1
rules:
  - id: SPW-HAWK-001
    title: Admin created, changed or removed another user's inbox rule that forwards, redirects or deletes
    category: mail
    severity: high
    hawk: H02
    logic: >-
      ExchangeAdmin New-InboxRule, Set-InboxRule or Remove-InboxRule where the rule's mailbox
      (parameter Mailbox, else the Identity's mailbox part) differs from the actor (UserId), and
      ForwardTo, ForwardAsAttachmentTo or RedirectTo is non-empty, DeleteMessage is True (the
      text "False" is false, unlike Hawk), or MoveToFolder is Deleted Items. Hawk 3
      admin_audit_events rows with the same cmdlets and parameters count too.
    tables: [ual_events, admin_audit_events]
    requires: []
    requires_evidence: [ual]
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [admin_inbox_rule]
    lookalikes: [admin_benign_rule, vendor_filing_rule]
  - id: SPW-HAWK-002
    title: FullAccess, SendAs or recipient permission granted (not the SYSTEM discovery grant)
    category: mail
    severity: high
    hawk: H03
    logic: >-
      Add-MailboxPermission with AccessRights containing FullAccess or SendAs,
      Add-RecipientPermission, or Add-ADPermission; excluding UserId "NT AUTHORITY\SYSTEM
      (Microsoft.Exchange.ServiceHost)" on a DiscoverySearchMailbox for Discovery Management.
      A mailbox_permissions full_access / send_as row whose grantee is a tenant user created in
      the window also counts.
    tables: [ual_events, admin_audit_events, mailbox_permissions]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [mailbox_permission_grant]
    lookalikes: [permission_system_discovery]
  - id: SPW-HAWK-003
    title: Mailbox forwarding parameter changed
    category: mail
    severity: medium
    hawk: H04
    logic: >-
      Set-Mailbox, Set-MailUser, Set-RemoteMailbox or Enable-RemoteMailbox with any of the
      parameters ForwardingAddress, ForwardingSmtpAddress, DeliverToMailboxAndForward,
      ExternalEmailAddress, RedirectTo (any value, including clearing it).
    tables: [ual_events, admin_audit_events]
    requires: []
    requires_evidence: [ual]
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    lookalike_collectors: [invictus, portal]
    positives: [forwarding_mailbox, internal_forwarding, forwarding_removed]
    lookalikes: [set_mailbox_other_param]
  - id: SPW-HAWK-004
    title: eDiscovery search created, run or exported
    category: config
    severity: medium
    hawk: H01
    logic: >-
      RecordType Discovery (24) with Operation in SearchCreated, SearchStarted,
      SearchExported, SearchExportDownloaded, SearchPreviewed, CaseAdded, HoldCreated (viewing a
      search, SearchViewed, is not enough; Hawk flags any Discovery record).
    tables: [ual_events]
    requires: []
    requires_evidence: [ual]
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [ediscovery_search]
    lookalikes: [ediscovery_view_only]
  - id: SPW-HAWK-005
    title: Domain added, verified or federated
    category: config
    severity: high
    hawk: H05
    logic: >-
      UAL AzureActiveDirectory Operation in "Add domain to company.", "Verify domain.",
      "Set domain authentication.", "Set federation settings on domain.", or directory audit
      activity in Add unverified domain, Verify domain, Set domain authentication, Set
      federation settings on domain. "Update domain." alone does not count.
    tables: [ual_events, directory_audits]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk4, invictus, portal]
    positives: [domain_federation]
    lookalikes: [domain_property_update]
  - id: SPW-HAWK-006
    title: OAuth consent granted
    category: apps
    severity: medium
    hawk: H06
    logic: >-
      UAL "Consent to application." or "Add delegated permission grant." / "Add
      OAuth2PermissionGrant.", or directory audit Consent to application / Add delegated
      permission grant, in the window. A sign-in to an app consented before the window does not
      count.
    tables: [ual_events, directory_audits]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [oauth_consent, low_risk_consent]
    lookalikes: [app_signin_existing_consent]
  - id: SPW-HAWK-007
    title: Consent grant in a risky category (broad scope, extremely dangerous, high risk)
    category: apps
    severity: high
    hawk: H07
    logic: >-
      oauth_grants row where consent_type is AllPrincipals granted in the window, or the
      permission ends in .All, or is AppRoleAssignment.ReadWrite.All / RoleManagement.ReadWrite.Directory
      (extremely dangerous), or is one of BitlockerKey.Read.All, Chat.*, Directory.ReadWrite.All,
      eDiscovery.*, Files.*, MailboxSettings.ReadWrite, Mail.ReadWrite, Mail.Send, Sites.*,
      User.ReadWrite*, User.Read.All (high risk). Unlike Hawk, User.Read / User.ReadBasic.All
      alone are not high risk; grants that existed before the window (first-party apps,
      AllPrincipals Microsoft Office) are context, not hits.
    tables: [oauth_grants, directory_audits, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    # portal included (architect-ruled contract correction): the Purview audit export
    # (portal.ual) carries the consent event with its granted scopes in the record's
    # ModifiedProperties (e.g. ConsentAction.Permissions = "Mail.ReadWrite Mail.Send
    # Files.ReadWrite.All offline_access User.Read"), so the rule works there even though
    # portal contributes no oauth_grants rows. Its low-risk consent
    # (openid profile email User.Read) is still not high risk.
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [oauth_consent]
    lookalikes: [low_risk_consent]
  - id: SPW-HAWK-008
    title: Risky or confirmed-compromised user
    category: identity
    severity: high
    hawk: H08, H09
    logic: >-
      risky_users row with risk_state confirmedCompromised, or risk_state atRisk and
      risk_level low, medium or high. Dismissed, remediated or none are not hits.
    tables: [risky_users]
    requires: [identity_protection]
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk4, invictus]
    positives: [aitm_signin, confirmed_compromised]
    lookalikes: [risk_dismissed]
  - id: SPW-HAWK-009
    title: Entra ID Protection risk detection
    category: identity
    severity: high
    hawk: H10, H11
    logic: >-
      risk_detections row with risk_state atRisk or confirmedCompromised and risk_level low,
      medium or high.
    tables: [risk_detections]
    requires: [identity_protection]
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk4, invictus]
    positives: [aitm_signin, confirmed_compromised]
    lookalikes: [risk_dismissed]
  - id: SPW-HAWK-010
    title: User inbox rule deletes, forwards or redirects mail
    category: mail
    severity: high
    hawk: H12
    logic: >-
      inbox_rules row with delete_message true, or non-empty forward_to,
      forward_as_attachment_to or redirect_to; or UAL New-InboxRule / Set-InboxRule /
      UpdateInboxRules creating such a rule.
    tables: [inbox_rules, ual_events, admin_audit_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [forwarding_inbox_rule, admin_inbox_rule, outlook_client_hiding_rule]
    lookalikes: [vendor_filing_rule, inbox_rule_finance, outlook_client_filing_rule, residential_replay_rule]
  - id: SPW-HAWK-011
    title: Mailbox forwarding configured
    category: mail
    severity: medium
    hawk: H13
    logic: >-
      mailboxes row (as collected) with forwarding_smtp_address or forwarding_address set.
    tables: [mailboxes]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4]
    positives: [forwarding_mailbox, internal_forwarding]
    lookalikes: [forwarding_removed]
  - id: SPW-HAWK-012
    title: Risky Entra sign-in
    category: identity
    severity: high
    hawk: H14
    logic: >-
      signins row with risk_level_during or risk_level_aggregated in low, medium, high
      (none and hidden are not hits).
    tables: [signins]
    requires: [identity_protection]
    requires_evidence: [signins]
    needs_geoip: false
    collectors: [hawk4, invictus]
    # The correlation negatives plant a genuinely risky (high) sign-in from the attacker proxy
    # (story/negatives.rs stale_risky_signin): a true hit of this rule's own logic.
    positives: [aitm_signin, mfa_after_stale_risk, inbox_rule_after_stale_risk, anonymous_link_after_stale_risk]
    lookalikes: [plausible_travel]
  - id: SPW-HAWK-013
    title: Mobile device first synced inside the investigation window
    category: identity
    severity: medium
    hawk: H15
    logic: >-
      mobile_devices row whose first_sync is inside the collection window
      (collections.window_start .. window_end).
    tables: [mobile_devices]
    requires: []
    requires_evidence: []
    needs_geoip: false
    # Hawk 3.1 records no investigation window anywhere (survey 2026-09-24 §1: no window in
    # Hawk.log / _Investigate.txt; the collection's window_start is NULL), so the logic is
    # undecidable on hawk3.
    collectors: [hawk4]
    positives: [new_mobile_device]
    lookalikes: [old_mobile_device]
  - id: SPW-HAWK-014
    title: Message header sender mismatch (P1/P2) or failed / anonymous authentication
    category: mail
    severity: medium
    hawk: null
    logic: >-
      email_artifacts row whose From address (inside <>) differs from Return-Path, or whose
      Authentication-Results show spf/dkim/dmarc fail, or X-MS-Exchange-Organization-AuthAs is
      Anonymous with an internal From domain; Hawk Message_Header_Findings rows "P1 P2 Match"
      with "don't Match" count too.
    tables: [email_artifacts]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk4, invictus]
    positives: [header_spoof]
    lookalikes: [header_clean]
  - id: SPW-HAWK-015
    title: Automatic reply enabled
    category: mail
    severity: low
    hawk: null
    logic: >-
      mailboxes auto_reply_state Enabled or Scheduled, or UAL Set-MailboxAutoReplyConfiguration
      with AutoReplyState Enabled or Scheduled.
    tables: [mailboxes, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk4, invictus, portal]
    positives: [autoreply_enabled]
    lookalikes: [autoreply_disabled]
  - id: SPW-MAIL-003
    title: Inbox rule with finance keywords or a hiding folder
    category: mail
    severity: high
    hawk: null
    logic: >-
      Inbox rule (inbox_rules, or UAL New-InboxRule / Set-InboxRule / UpdateInboxRules) whose
      SubjectContainsWords, BodyContainsWords or SubjectOrBodyContainsWords hit
      @list:finance_keywords, or whose MoveToFolder is in @list:hiding_folders (RSS Feeds, RSS
      Subscriptions, Conversation History, Archive, Junk Email, Deleted Items) or is a single
      character.
    tables: [inbox_rules, ual_events, admin_audit_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    # admin_inbox_rule: its throw-away rule moves mail to Deleted Items, a hiding folder.
    positives: [inbox_rule_finance, admin_inbox_rule, outlook_client_hiding_rule, residential_replay_rule]
    lookalikes: [vendor_filing_rule, outlook_client_filing_rule]
  - id: SPW-MAIL-004
    title: External forwarding through the mailbox, an inbox rule or a transport rule
    category: mail
    severity: high
    hawk: null
    logic: >-
      A forwarding address outside tenant_domains: mailboxes forwarding_smtp_address /
      forwarding_address, inbox_rules forward_to / forward_as_attachment_to / redirect_to,
      transport_rules blind_copy_to / redirect_to / copy_to / add_to_recipients, or the UAL
      events that set them (Set-Mailbox, New-/Set-InboxRule, New-/Set-TransportRule).
    tables: [mailboxes, inbox_rules, transport_rules, ual_events, admin_audit_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [forwarding_mailbox, forwarding_inbox_rule, forwarding_transport_rule, admin_inbox_rule]
    lookalikes: [internal_forwarding]
  - id: SPW-MAIL-005
    title: MailItemsAccessed bind burst
    category: mail
    severity: high
    hawk: null
    logic: >-
      At least 5 MailItemsAccessed records with MailAccessType Bind, or at least 100 accessed items, for
      one mailbox from one client IP within 30 minutes, counted only when the address is a hosting ASN
      (ip_intel.is_hosting) or a password-spray source of the tenant, or its network (ASN, else the
      address) is not one the accessing user signed in from on at least 3 distinct days. The history is
      successful sign-ins (error_code 0 or NULL) on UTC days strictly BEFORE the burst's day, and a user
      with fewer than 3 such days is judged by the hosting and spray tests alone. One finding per
      (mailbox, UTC day). Sync records and Microsoft service addresses never count.
    tables: [ual_events, mail_items_accessed]
    requires: []
    requires_evidence: [mail_items_accessed]
    needs_geoip: false
    collectors: [hawk4, invictus, portal]
    # mia_burst_residential: a non-hosting residential address in a country the user was never in (the
    # foreign-network path alone). spray_success: the spray source sits in the user's own ISP, so only
    # the spray-source path sees it.
    # spray_success is seen only through the spray-source relation, which needs the tenant-wide
    # sign-in export (a spray source is an address that failed against 5 distinct users).
    kind_collectors:
      spray_success: [invictus, portal]
    positives: [mia_burst, mia_burst_residential, spray_success]
    lookalikes: [mia_sync, mia_heavy_desktop]
  - id: SPW-MAIL-006
    title: Mail sent from an IP address the user never used before
    category: mail
    severity: medium
    hawk: null
    logic: >-
      UAL Send / SendAs / SendOnBehalf from an address the user never used on an EARLIER UTC day
      (same-day activity never makes an address, a network or a country known) that is a hosting ASN or a
      password-spray source of the tenant, whatever the user's history (a brand-new account's first send
      counts: that arm needs no baseline); or, for a user with activity on at least 3 earlier UTC days, from
      a network (ASN, else the address) the user never used on an earlier day that also meets one of: a
      country the user was never seen in on an earlier day, a medium/high risk sign-in of the user in the
      previous 24 hours, or no ip_intel country for the address (the qualifier is waived, so partial
      GeoIP never suppresses). Microsoft service addresses never count.
    tables: [ual_events]
    requires: []
    requires_evidence: [mail_send]
    needs_geoip: false
    collectors: [hawk4, invictus, portal]
    # send_new_ip sends from the replay address it signed in from the same day (same-day activity never
    # makes an address known). send_residential: a non-hosting residential address in a new country (the
    # new-network path alone). spray_success: the spray-source path alone.
    # spray_success is seen only through the spray-source relation, which needs the tenant-wide
    # sign-in export (a spray source is an address that failed against 5 distinct users).
    # New accounts: the password-spray scenario runs send_new_ip (positive) and send_new_isp / send_new_office_egress
    # (look-alikes: an ordinary new ISP, and a first-seen office egress address no earlier day has seen) on days 1-2 of the window, where the user has fewer than three earlier active days: only
    # the hosting / spray-source arm judges such a send. The spray-source arm has no synth positive for a new
    # account (sign-ins before the 30-day retention are not delivered); the rule's own tests cover it.
    kind_collectors:
      spray_success: [invictus, portal]
    positives: [send_new_ip, send_residential, spray_success]
    lookalikes: [send_known_ip, send_new_isp, send_new_office_egress]
    computed:
      - kind: plausible_travel
        condition: new_network_send
        reason: "a traveller's first send on arrival day in a new country is a new network and country by the rule's logic (documented limitation); whether it fires depends on the user's history before the trip in the delivered rows (three earlier active days, the destination network and country unseen on an earlier day)"
  - id: SPW-MAIL-007
    title: Mailbox or SharePoint search for finance keywords
    category: mail
    severity: medium
    hawk: null
    logic: >-
      search_queries (or UAL SearchQueryInitiatedExchange / SearchQueryInitiatedSharePoint)
      whose query_text hits @list:finance_keywords.
    tables: [ual_events, search_queries]
    requires: []
    requires_evidence: [search_queries]
    needs_geoip: false
    collectors: [hawk4, invictus, portal]
    positives: [search_finance]
    lookalikes: [search_benign]
  - id: SPW-MAIL-008
    title: Mail deleted by a delegate from an unusual network or with a finance subject
    category: mail
    severity: high
    hawk: null
    logic: >-
      UAL SoftDelete / HardDelete / MoveToDeletedItems by a delegate (the mailbox differs from the
      actor, or LogonType 1 admin / 2 delegate; system actors and S-1-5-* SIDs excluded) where the
      client IP is a hosting ASN (ip_intel.is_hosting) or any AffectedItems[*].Subject /
      Item.Subject hits @list:finance_keywords. One hit per delete record; context.severity_reason
      names the condition that held (hosting, finance_subject, hosting+finance_subject).
    tables: [ual_events]
    requires: []
    requires_evidence: [ual]
    needs_geoip: false
    collectors: [hawk4, invictus, portal]
    positives: [delegate_finance_delete]
    lookalikes: [assistant_cleanup]
  - id: SPW-MAIL-009
    title: Inbound mail from a look-alike domain
    category: mail
    severity: high
    hawk: null
    logic: >-
      message_trace sender registrable domain r (last two labels of the sender host; not a tenant
      registrable domain; first label at least 6 characters) that looks like a tenant domain (arm
      tenant) or like a registrable domain first seen at least 14 days before r (arm
      correspondent): equal skeletons (rn->m, vv->w, 0->o, 1->l, cl->d), or the same TLD and first
      labels at levenshtein 1 (blocked by TLD, length and a half-label prefix or suffix key). Two
      hosts of one registrable domain are never a pair. No stage (inbound mail, like
      SPW-HAWK-014). One hit per trace row, actor_upn is the recipient; context names
      look_alike_of and arm.
    tables: [message_trace]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [invictus, portal]
    positives: [lookalike_vendor_invoice]
    lookalikes: [similar_unrelated_domain]
  - id: SPW-ID-001
    title: MFA method registered after a risky sign-in
    category: identity
    severity: high
    hawk: null
    logic: >-
      Directory audit "User registered security info" / "Update user" with
      StrongAuthentication* modified properties (or UAL "Update user." with the same), within 24
      hours after a sign-in of the same user that is risky (risk level medium/high) or comes
      from a hosting ASN (ip_intel.is_hosting).
    tables: [directory_audits, ual_events, signins]
    requires: []
    requires_evidence: []
    needs_geoip: true
    # Hawk 3.1 exports no Entra sign-in log and no Entra ID audit log (survey; hawk-layouts
    # §7.2), but its UAL carries both halves: the UAL "Update user." with StrongAuthentication
    # properties and a UserLoggedIn from a hosting IP (evidence_all_of pairs signins with
    # ual_events). Hawk 4's sign-in files do not reach back to the AiTM sign-in either, so the
    # UAL is the risky-sign-in evidence there too; hawk3 is a collector.
    evidence_all_of: [[directory_audits, ual_events], [signins, ual_events]]
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [mfa_method_added]
    lookalikes: [mfa_new_hire, mfa_after_stale_risk]
    correlation_negatives: [mfa_after_stale_risk]
  - id: SPW-ID-002
    title: Sign-in from a hosting-provider ASN
    category: identity
    severity: medium
    hawk: null
    logic: >-
      Successful sign-in (signins with error_code 0 or NULL, or UAL UserLoggedIn) whose IP has
      ip_intel.is_hosting (rules/lists/hosting_asns.yaml; Microsoft AS8075 is not hosting), except the
      sign-ins (interactive or not: the portal export records a connector's backend as interactive) of a
      tenant-wide cloud service, to that application from that same hosting ASN
      (cloud_services, one row per application and ASN, established from the whole case: at least 5 users
      with known successes from that ASN on at least 3 days, at least 80% of the application's successes); another ASN, another
      application, a logon or sign-in from a password-spray source and a UAL UserLoggedIn with no application
      id always count; a UAL UserLoggedIn (ual_events.app_id) of the service from its ASN is excused exactly
      like its sign-ins. Residual:
      an attacker using the same application from the same cloud ASN as an established connector is
      excused, and a connector's first days are too (no cold start; SPW-ID-005 and the consent rules remain).
      A Microsoft FIRST-PARTY application (rules/lists/microsoft_first_party_apps.yaml: ids from public
      Microsoft Learn pages) is never a service, whatever its users or days: phished accounts used from a
      VPS sign in to OfficeHome or Outlook, while a real connector is a third-party application. Residual:
      an attacker on a third-party application (which needs a consent, APP-001 / APP-002 report it) or on a
      first-party application the list does not have.
      An (application, ASN) is NOT a service when sprayed users (a credential failure from a spray source)
      are at least 20% of its users or at least 3 of them are sprayed, or when at least 3 distinct users have
      an interactive credential failure to the application from that ASN; 5+ PHISHED accounts used from one
      VPS on one THIRD-PARTY application for 3+ days with no failures are excused (residual), and so are up to 2
      distinct failing users and up to 2 sprayed users while they are under 20% of the pair's users (only when
      the pair has 11 or more users); such sprayed accounts, used from the connector's own (application, ASN)
      from an address that is not a spray source, are reported by neither ID-002, ID-003 nor SPW-ID-005
      (ID-005 reads only successes from a spray-source address).
    tables: [signins, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: true
    collectors: [hawk3, hawk4, invictus, portal]
    # The correlation negatives and the illicit consent each carry a successful sign-in of the
    # attacker's proxy or replay address (a hosting ASN, far from the user's home): the logic hits.
    # The cloud-service profile is established from the whole case (no prefix), so a connector's first
    # days are excused too and cloud_connector_onboarding is a look-alike. An (app, ASN) is NOT a cloud
    # service when sprayed users (a credential failure from a spray source) are >= 20% of its users or
    # >= 3 of them, or when >= 3 distinct users have an interactive credential failure to the app from
    # that ASN. spray_vps_login: accounts taken from a spray
    # and used from a cloud VPS (its sprayed users disqualify the pair; the hit cites a sign-in record,
    # the storyline has no UAL logon); vps_password_failures: wrong passwords first on the VPS by three
    # users, no spray (the failures from the ASN disqualify it). Residual: 5+ PHISHED accounts used from one VPS on one
    # app for 3+ days with no failures look like a connector and are excused. connector_app_other_asn: the connector's own application from a
    # different hosting ASN. Known limit: a per-user collection (Hawk 4, a few users) cannot establish a
    # connector, so a connector's sign-ins of its investigated users hit there; the scenario's connector
    # users are not Hawk 4's.
    # vps_phished_accounts: 8 phished accounts on OfficeHome from one VPS for 4 days, no failures, no spray: by the counts alone a
    # connector, but OfficeHome is a Microsoft first-party application, which is never a service. The connector storylines
    # (third-party app ids; mid-window or from day one) stay look-alikes: a legitimate connector onboarded mid-capture looks exactly
    # like an (app, ASN) that appears mid-window, so the window cannot discriminate (the first-party list does).
    # The VPS positives are sign-ins only (no UAL logon): Hawk 3 delivers no sign-in log, so it cannot supply them.
    kind_collectors:
      spray_vps_login: [hawk4, invictus, portal]
      vps_password_failures: [hawk4, invictus, portal]
      vps_phished_accounts: [hawk4, invictus, portal]
    positives: [aitm_signin, inbox_rule_after_stale_risk, mfa_after_stale_risk, anonymous_link_after_stale_risk, oauth_consent, spray_vps_login, vps_password_failures, connector_app_other_asn, vps_phished_accounts]
    lookalikes: [microsoft_asn_signin, cloud_connector, cloud_connector_onboarding, cloud_connector_longstanding, connector_user_own_rule]
  - id: SPW-ID-003
    title: Impossible travel
    category: identity
    severity: medium
    hawk: null
    logic: >-
      Two successful sign-ins (error_code 0 or NULL, or UAL UserLoggedIn) of one user whose locations
      (ip_intel latitude/longitude) imply a speed above 900 km/h, both at least 500 km from each other. A
      pair whose two addresses are in the same country counts only when an end is a hosting address or a
      password-spray source of the tenant; a cross-country pair, or a pair with an unknown country, counts
      as before. The sign-ins of a tenant-wide cloud service (established from the whole case) to its application from its
      hosting ASN (cloud_services, per application and ASN, interactive or not; not a service when sprayed users are 20% of its users or 3 of them, or 3 users
      failed their credentials from the ASN) form no pair, and neither do the service's UAL UserLoggedIn records
      (ual_events.app_id); another ASN, a UAL record with no application id and spray-source sign-ins always do.
    tables: [signins, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: true
    collectors: [hawk3, hawk4, invictus, portal]
    # Only aitm_signin always meets the logic (its proxy sign-in pairs with the user's home sign-in
    # on every seed). The stale-risk negatives and oauth_consent each carry a hosting sign-in far
    # from home too, but whether it is over 500 km and 900 km/h from the user's seeded home
    # location depends on the seed and the scenario, so they are exceptions, not positives.
    # replay_other_country: a cross-country pair between two ORDINARY ISPs (no hosting end).
    positives: [aitm_signin, replay_other_country, spray_success_foreign]
    # residential_replay_rule: a same-city, same-country, non-hosting replay forms no pair.
    lookalikes: [plausible_travel, carrier_geo_jitter, cloud_connector_longstanding, residential_replay_rule]
    computed:
      - kind: oauth_consent
        condition: impossible_travel
        reason: &far_hosting "the storyline carries a successful sign-in or logon from an attacker address; whether it forms an impossible-travel pair with the user's neighbouring delivered sign-in depends on the user's seeded home location and on the rows the collector delivers"
      - kind: inbox_rule_after_stale_risk
        condition: impossible_travel
        reason: *far_hosting
      - kind: mfa_after_stale_risk
        condition: impossible_travel
        reason: *far_hosting
      - kind: anonymous_link_after_stale_risk
        condition: impossible_travel
        reason: *far_hosting
      - kind: vps_phished_accounts
        condition: impossible_travel
        reason: "the phished accounts' hosting sign-ins are no cloud service's (a first-party application), so a user's VPS sign-in forms a pair with a neighbouring home sign-in when the seeded home city is far enough and fast enough; that depends on the seed"
  - id: SPW-ID-004
    title: Adversary-in-the-middle indicators
    category: identity
    severity: high
    hawk: null
    logic: >-
      A session (session_id / AADSessionId) created by an interactive sign-in (or one of unknown kind,
      is_interactive NULL, as spray_sources counts it) that satisfied MFA (error_code 0 or NULL) and used
      within 1 hour from a different NETWORK. The country differs
      (ip_intel), or the ASN differs and the use or the creating sign-in is a hosting ASN or a
      password-spray source of the tenant (spray_sources), or the use is a sign-in rated medium/high
      risk, or the ASN differs and the OS or browser of the use differs from the creating sign-in's
      (signins device, UAL UserLoggedIn DeviceProperties). A successful UAL UserLoggedIn (session id
      from DeviceProperties) also creates a session, so an audit-log-only case sees a move. A
      Microsoft service address (ip_intel.is_microsoft) on either side never counts, and a plain
      address change inside one ASN (IPv6 privacy rotation, carrier pools, a Wi-Fi to cellular switch in
      one country) is not a move. When the ASN is missing on either side (no GeoIP data or a partial
      record) the address difference alone counts, unless both countries are known and differ (then the
      country test counts it). Or a sign-in with a successful or unknown result (error_code 0 or
      NULL) or UAL UserLoggedIn / MailboxLogin / MailItemsAccessed whose user agent is in
      @list:suspicious_user_agents (axios, python-requests, curl, Go-http-client, node-fetch); a failed
      scripted sign-in (a legacy-auth password spray) is not reported.
    tables: [signins, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    # Hawk sign-in rows carry no session id, so the two UA-less replays are visible only where the
    # collector delivers it.
    kind_collectors:
      replay_other_country: [invictus, portal]
      spray_replay: [invictus, portal]
    # replay_other_country keeps the user's own browser agent (no scripted-agent arm) and replays from a
    # residential address of another country: only session_moved sees it. spray_replay replays from a
    # same-country spray source: only the spray-source infrastructure test sees it.
    positives: [aitm_signin, replay_other_country, spray_replay]
    # mia_burst reads the mailbox in the AiTM session from the attacker's mailbox address, which is in
    # the proxy's own network (same ASN and country as the MFA sign-in that created the session), with
    # Outlook on the web or a Graph client: no network change for session_moved and no scripted agent,
    # so it must never trigger the rule.
    # residential_replay_rule replays the session from a residential ISP of the victim's own city (same
    # country, not hosting, not a spray source, no risk, the user's own agent): no signal of this rule,
    # the residual SPW-ID-007 closes.
    lookalikes: [same_ip_token_use, wifi_to_cellular, ipv6_rotation, password_spray, mia_burst, residential_replay_rule]
    computed:
      - kind: inbox_rule_finance
        condition: aitm_indicators
        reason: &stolen_session "the storyline reuses the AiTM sign-in session from another address (a true session_moved signal); it fires only where the creating MFA sign-in is delivered with its session id (not Hawk, not a tree without sign-ins or without an AiTM sign-in) and the use falls within the hour after it"
      - kind: forwarding_inbox_rule
        condition: aitm_indicators
        reason: *stolen_session
  - id: SPW-ID-005
    title: Successful sign-in from a password-spray source
    category: identity
    severity: high
    hawk: null
    logic: >-
      A successful sign-in (signins error_code 0, or UAL UserLoggedIn) of a user from an address
      in the tenant's spray_sources (an address with credential failures - the shared
      credential_failure_codes list, interactive rows only, an unknown kind counting as interactive; 50055, an expired password, is in the list, so an expired-password user behind a shared address counts as a failed user - from at least 5 SPRAYED users (a failed user is
      excused only by a known success from the address before their first failure there, or within 30 minutes
      after one of their failures there; a later success is a takeover and does not excuse) who outnumber the
      excusing users (users with a success there minus the late takeovers), so an office NAT or VPN egress is
      not a source and a proxy that takes accounts over stays one; any network type, no GeoIP needed; the sign-ins must cover at
      least 5 users, else the rule is not_applicable), before or after the source's first failure
      (attacker infrastructure either way). A NULL-result sign-in is ignored on purpose: a NULL could
      be a failure and this rule is high severity. Context: users and failures of the source, its
      first and last failure, whether the user was sprayed (a credential failure of the shared
      credential_failure_codes list, interactive) and whether the success preceded the first failure.
    tables: [signins, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    # The population threshold of the spray definition: a per-user collection (Hawk's few
    # investigated users) covers fewer than 5 users and the run says so (not_applicable).
    min_signin_users: 5
    # The spray (failed sign-ins) and the success. Hawk 3.1 exports no Entra sign-in log, so no
    # source can exist there and the evidence is incomplete.
    evidence_all_of: [[signins], [signins, ual_events]]
    # Hawk 4 collects sign-ins for the few investigated users only (fewer than 5): the spray rules are
    # not_applicable there, so no positive can hit; its look-alikes still can (a tenant with 5+ users).
    collectors: [invictus, portal]
    lookalike_collectors: [hawk4, invictus, portal]
    # spray_after_phish: the success comes BEFORE the first failure and the victim was not sprayed.
    # spray_success_foreign: a foreign residential source. spray_proxy_takeover: a proxy that took
    # accounts and used them on later days stays a spray source. password_spray is real spray below the
    # 5-user threshold (a threshold look-alike).
    positives: [spray_success, spray_replay, spray_after_phish, spray_success_foreign, spray_proxy_takeover]
    lookalikes: [distributed_spray, office_nat_mistypes, office_stale_accounts, office_window_mistypes, phone_stale_password, password_spray, gateway_egress, conference_network]
    correlation_negatives: [office_nat_mistypes]
  - id: SPW-ID-006
    title: Password spray against the tenant
    category: identity
    severity: low
    hawk: null
    logic: >-
      One finding per tenant per UTC day on which an address in the tenant's spray_sources (see
      SPW-ID-005) had credential failures (the shared credential_failure_codes list, interactive
      rows only: not Conditional Access blocks, token-refresh errors or MFA prompts). The sign-ins
      must cover at least 5 users, else the rule is not_applicable. The finding has no actor; its context holds the sources, users targeted,
      failures, top error codes, the hosting versus other-network source counts and whether any
      source later succeeded.
    tables: [signins]
    requires: []
    requires_evidence: []
    needs_geoip: false
    # The population threshold of the spray definition: a per-user collection (Hawk's few
    # investigated users) covers fewer than 5 users and the run says so (not_applicable).
    min_signin_users: 5
    # Hawk 4 collects sign-ins for the few investigated users only (fewer than 5): the spray rules are
    # not_applicable there, so no positive can hit; its look-alikes still can (a tenant with 5+ users).
    collectors: [invictus, portal]
    lookalike_collectors: [hawk4, invictus, portal]
    positives: [distributed_spray, spray_success, spray_replay, spray_after_phish, spray_success_foreign, spray_proxy_takeover, spray_vps_login]
    lookalikes: [office_nat_mistypes, office_stale_accounts, office_window_mistypes, phone_stale_password, password_spray, gateway_egress, conference_network]
  - id: SPW-ID-007
    title: Persistence within 60 minutes of the user's first sign-in from a new same-country network
    category: identity
    severity: high
    hawk: null
    logic: >-
      A persistence action of a user - UAL / Hawk 3 admin audit New-InboxRule, Set-InboxRule,
      UpdateInboxRules, Add-MailboxPermission, Add-RecipientPermission, Add-MailboxFolderPermission,
      Set-MailboxFolderPermission, New-TransportRule, Set-TransportRule, Set-MailboxJunkEmailConfiguration,
      Set-Mailbox setting a non-empty ForwardingSmtpAddress or ForwardingAddress; directory audit / UAL
      Consent to application, Add app role assignment grant to user, Add app role assignment to service
      principal, User registered security info, User registered all required security info, Add member to
      role, Register device, Add device, Add registered owner to device, Add registered users to device, Add
      service principal credentials, Update application - Certificates and secrets management, or Update
      user of the strong-authentication details - at most 60 minutes (inclusive) after that user's FIRST
      successful sign-in (error_code 0 or NULL, or UAL UserLoggedIn not Failed) from an ASN (history is the
      user's successful sign-ins in the case, so the ASN was not used on an earlier day), from that network
      or attacker infrastructure: when the persistence record carries a non-Microsoft address whose ASN
      ip_intel knows, it counts if that ASN is the new network's or a hosting ASN, or the address is a
      spray source of the tenant, and not from another ordinary network (a record with no address, an
      unknown ASN or a Microsoft address counts). That sign-in must be from a country the user signed in from on an earlier UTC day, not a
      hosting ASN, not a Microsoft address, with ASN and country known to ip_intel, and not rated
      medium/high by any Entra sign-in of the user from the same address within 120 seconds of it (the UAL
      row has no rating and its timestamp differs by seconds); the user must have successful sign-ins on at
      least 3 distinct UTC days before its day (a user's first three active days are never judged). The
      trigger is the persistence record; the new-network sign-in is in the context.
    tables: [ual_events, admin_audit_events, directory_audits, signins]
    requires: []
    requires_evidence: []
    needs_geoip: true
    # The persistence half and the preceding new-network sign-in.
    evidence_all_of: [[ual_events, admin_audit_events, directory_audits], [signins, ual_events]]
    collectors: [hawk3, hawk4, invictus, portal]
    # residential_replay_rule: a stolen session replayed from a residential ISP of the victim's own
    # country, then the finance inbox rule from it within the hour. The look-alikes and the condition
    # each guards: new_carrier_phone, the new network alone (it fails only if sign-ins alone ever fired);
    # rule_edit_after_new_network, both halves on the same network two hours apart (the window);
    # other_device_rule_edit, both halves within the hour from two networks (the persistence's network);
    # admin_role_changes, the admin's routine role changes right after a sign-in from the office (a
    # known network).
    positives: [residential_replay_rule]
    lookalikes: [new_carrier_phone, rule_edit_after_new_network, other_device_rule_edit, admin_role_changes]
    correlation_negatives: [rule_edit_after_new_network, other_device_rule_edit]
  - id: SPW-ID-010
    title: Inbox rule created within 60 minutes of a risky or hosting-ASN sign-in
    category: identity
    severity: high
    hawk: null
    logic: >-
      UAL New-InboxRule / Set-InboxRule / UpdateInboxRules whose actor had, in the preceding 60
      minutes, a sign-in with risk_level_during medium/high or from ip_intel.is_hosting
      (spec §8.2 example). The hosting arm counts only a successful or unknown-result sign-in
      (error_code 0 or NULL) or a UAL UserLoggedIn whose result is not Failed, and skips a
      tenant-wide cloud service's own sign-ins to its application from its ASN (cloud_services; UAL
      UserLoggedIn by ual_events.app_id) unless the address is a password-spray source; the risk arm
      has neither condition. The hosting arm also ties the rule record to the infrastructure: a record that
      carries a non-Microsoft client address whose ASN ip_intel knows correlates with a hosting sign-in
      only from that sign-in's ASN, from any hosting ASN, or from a spray-source address (the tie
      SPW-ID-007 uses); no address, an unknown ASN or a Microsoft address counts as before, and the risk arm
      has no tie. Residual: an attacker who signs in from a VPS and creates the rule from a residential
      proxy within the hour is not reported here (ID-002 reports the VPS sign-in; ID-007 or ID-004 may see
      the proxy). The synthetic Hawk 3 admin audit rows carry no client address, so they are never tied out. Hawk 3.1 records New-InboxRule / Set-InboxRule in
      Search-AdminAuditLog (admin_audit_events, CmdletName + Caller + RunDate) instead of the
      UAL; Phase 6 implements both sources.
    tables: [ual_events, signins, admin_audit_events]
    requires: []
    requires_evidence: []
    needs_geoip: true
    # The inbox-rule half and the preceding risky / hosting-ASN sign-in.
    evidence_all_of: [[ual_events, admin_audit_events], [signins, ual_events]]
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [inbox_rule_finance]
    # residential_replay_rule: the rule follows a sign-in that is neither risky nor from a hosting ASN.
    # connector_user_own_rule: a connector user's own rule from their office within the hour after a connector sign-in.
    lookalikes: [vendor_filing_rule, inbox_rule_after_stale_risk, residential_replay_rule, connector_user_own_rule]
    correlation_negatives: [inbox_rule_after_stale_risk]
    computed:
      - kind: forwarding_inbox_rule
        condition: risky_rule_correlation
        reason: "the attacker's forwarding rule (New-InboxRule) follows the AiTM sign-in within the hour: a true hit of this rule's logic wherever the scenario has that risky or hosting sign-in and the collector delivers it (hawk-investigate has none)"
  - id: SPW-ID-011
    title: Refresh-token replay after revocation
    category: identity
    severity: high
    hawk: null
    logic: >-
      signins with error_code 50173 (a refresh token that no longer works after a session revocation
      or password reset; deliberately not a credential failure) whose network (the ASN from
      ip_intel, else the address) never appears in the user's successful sign-ins (error_code 0 or
      NULL) at any time in the case, or whose address is a hosting ASN (ip_intel.is_hosting). A hit
      only when the user has at least 5 such rows within 24 hours; every qualifying row of such a
      burst is a hit. context: UTC day, count, distinct networks (ASN, else the IP) per user per UTC
      day, first and last time.
    tables: [signins]
    requires: []
    requires_evidence: []
    needs_geoip: true
    # Hawk 3 delivers no sign-in log (only the UAL), so it can neither hit nor stay quiet here.
    collectors: [hawk4, invictus, portal]
    positives: [token_replay_after_revoke]
    # post_reset_refresh_noise: the user's own device fails 50173 after a reset from their usual
    # residential network, which has successful sign-ins on other days.
    lookalikes: [post_reset_refresh_noise]
  - id: SPW-ID-012
    title: One sign-in session used from many networks
    category: identity
    severity: high
    hawk: null
    logic: >-
      UAL records with a session_id whose client IP has a known ASN in ip_intel (Microsoft service
      and private addresses excluded), grouped by exact (user, session_id, UTC day): a hit when the
      day has at least 2 distinct hosting ASNs or at least 4 distinct ASNs. One hit per qualifying
      day, keyed to that day's first record. context: session_id, sorted ASN list, distinct IP count,
      day, hosting ASN count.
    tables: [ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: true
    collectors: [hawk4, invictus, portal]
    positives: [session_hopping_proxy]
    # session_roaming_user: one session on home, a hotel network and a hotspot, three non-hosting
    # ASNs, under the four-ASN threshold.
    lookalikes: [session_roaming_user]
    computed:
      - kind: inbox_rule_finance
        condition: session_networks
        reason: "the storyline reuses the AiTM session from the attacker's replay address while the proxy address (another hosting ASN) used it the same day: a true hit of this rule's logic where the collector delivers UAL session ids and ASN data for both addresses"
  - id: SPW-ID-013
    title: Self-service password reset from a new country
    category: identity
    severity: medium
    hawk: null
    logic: >-
      Directory audit "Reset password (self-service)", "Self-service password reset flow activity
      progress" or "Change password (self-service)" whose initiating address has a country in
      ip_intel (Microsoft and private addresses excluded) that no successful sign-in of the user
      (initiated_by_upn, else the audit's target user; error_code 0 or NULL) before the reset comes
      from; users with no successful sign-in of known country before the reset are not judged.
      One hit per audit row. context: country, city, activity, result.
    tables: [directory_audits]
    requires: []
    requires_evidence: []
    needs_geoip: true
    # Hawk 3 delivers neither the Entra audit log nor the sign-in log; the portal exports only the
    # Purview UAL and the interactive sign-ins, not the directory audit this rule reads.
    collectors: [hawk4, invictus]
    positives: [sspr_foreign]
    # sspr_home_country: the user resets their own password from home, the country of all their sign-ins.
    lookalikes: [sspr_home_country]
  - id: SPW-APP-001
    title: Consent to an app with Mail.*, Files.* or offline_access
    category: apps
    severity: high
    hawk: null
    logic: >-
      A consent in the window (oauth_grants created in the window, directory audit Consent to
      application, or UAL "Consent to application.") whose permissions include Mail.*,
      Files.*, or offline_access together with any Mail.* / Files.* scope.
    tables: [oauth_grants, directory_audits, ual_events]
    requires: []
    requires_evidence: []
    needs_geoip: false
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [oauth_consent]
    lookalikes: [low_risk_consent]
  - id: SPW-APP-002
    title: New credential on an application or service principal
    category: apps
    severity: high
    hawk: null
    logic: >-
      Directory audit / UAL "Add service principal credentials" / "Update application –
      Certificates and secrets management" adding a password credential to a service principal,
      or adding any credential when the actor had a risky or hosting-ASN sign-in in the
      preceding 24 hours; app_credentials rows whose start is in the window support the hit.
    tables: [directory_audits, ual_events, app_credentials]
    requires: []
    requires_evidence: []
    needs_geoip: true
    collectors: [hawk3, hawk4, invictus, portal]
    positives: [app_credential_added]
    lookalikes: [cert_rotation]
  - id: SPW-FILE-001
    title: Mass file download
    category: files
    severity: medium
    hawk: null
    logic: >-
      At least 30 FileDownloaded / FileSyncDownloadedFull records by one user within 15 minutes.
    tables: [ual_events, file_events]
    requires: []
    requires_evidence: [ual]
    needs_geoip: false
    # Hawk 3.1 exports no SharePoint/OneDrive UAL (survey; hawk-layouts §7).
    collectors: [hawk4, invictus, portal]
    lookalike_collectors: [invictus, portal]
    positives: [mass_download]
    lookalikes: [normal_download]
  - id: SPW-FILE-002
    title: Anonymous sharing link created after a compromise indicator
    category: files
    severity: high
    hawk: null
    logic: >-
      AnonymousLinkCreated (sharing_events link_type anonymous) by a user who had a risky or
      hosting-ASN sign-in in the preceding 24 hours.
    tables: [ual_events, sharing_events, signins]
    requires: []
    requires_evidence: [ual]
    needs_geoip: true
    # The sharing event and the preceding risky / hosting-ASN sign-in.
    evidence_all_of: [[ual_events, sharing_events], [signins, ual_events]]
    # Hawk 3.1 exports no SharePoint/OneDrive UAL (survey; hawk-layouts §7).
    collectors: [hawk4, invictus, portal]
    lookalike_collectors: [invictus, portal]
    positives: [anonymous_link]
    lookalikes: [anonymous_link_benign, anonymous_link_after_stale_risk]
    correlation_negatives: [anonymous_link_after_stale_risk]
  - id: SPW-FILE-003
    title: OneNote or PDF lure uploaded and shared
    category: files
    severity: high
    hawk: null
    logic: >-
      FileUploaded of a .one, .onetoc2, .onepkg or .pdf file (file_events is_onenote or
      file_ext pdf) followed within 24 hours by a sharing event on the same file (SharingSet,
      SharingInvitationCreated, CompanyLinkCreated, AnonymousLinkCreated) that reaches an
      external target or a company-wide link.
    tables: [ual_events, file_events, sharing_events]
    requires: []
    requires_evidence: [ual]
    needs_geoip: false
    # The upload half and the sharing half of the lure.
    evidence_all_of: [[ual_events, file_events], [ual_events, sharing_events]]
    # Hawk 3.1 exports no SharePoint/OneDrive UAL (survey; hawk-layouts §7).
    collectors: [hawk4, invictus, portal]
    lookalike_collectors: [invictus, portal]
