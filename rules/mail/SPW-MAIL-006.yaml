# SPW-MAIL-006 — mail sent from a network the user has not been seen on. Logic source:
# coverage.yaml ("UAL Send / SendAs / SendOnBehalf whose client_ip appears in no earlier ual_events
# or signins row of the same user in the case", tuned: see below).
# Tuning, because a plain "new address" is background for most users (a new phone, a rotating
# IPv6 privacy address, a carrier pool, a new home connection; Microsoft Learn,
# audit-log-activities: the ClientIPAddress of a Send is simply the client's address):
#   1. History: the user must have activity (ual_events or signins) on at least 3 distinct days
#      BEFORE the send's day. A short or partial capture, or a user first seen today, has no
#      baseline to deviate from; their first sends are not judged (not a miss we can tell from
#      normal use).
#   2. Network, not address: "known" compares the network of the send's address - the ASN from
#      ip_intel, else the address itself when ip_intel has no ASN - with the networks of the
#      user's earlier events. A different address in a network the user has used is not new.
#      KNOWN MEANS AN EARLIER UTC DAY: an address, network or country is known only if the user used it
#      on a UTC day before the send's day. Same-day activity never makes it known, so an attacker that
#      signs in from the replay host and sends from the same host in one session does not make that
#      host look normal.
#      The one exception is a hosting ASN (ip_intel.is_hosting) or a password-spray source of the
#      tenant (spray_sources: compromised ISP routers and residential proxies are not hosting ASNs):
#      there the exact address decides
#      (a first send from an address the user was never seen on is the hit), because a hosting
#      network the user was seen on only through the attacker's own earlier sign-ins (one
#      provider, several addresses) must not hide the attacker's send.
#   3. Qualifier: a new network that is neither hosting nor a spray source still means little, so the send must also come
#      from a country the user has not been seen in, or follow a sign-in of the same user rated
#      medium/high risk by Entra in the previous 24 hours, or ip_intel has no country for the address
#      (no GeoIP, or an ASN-only record: the country qualifier cannot be tested and is waived, so
#      partial GeoIP never suppresses the send; the analyst reads the address).
#   4. Microsoft service front ends (ip_intel.is_microsoft: Outlook mobile / Exchange egress) never
#      count as the user's network.
# Missed on purpose: an attacker send from an ordinary-ISP network in the user's own country with no
# risk rating - the user's other signals (SPW-ID-004, SPW-ID-010, SPW-MAIL-003) cover that.
# `sql:` because the history is a lookup over two tables.
id: SPW-MAIL-006
title: Mail sent from an IP address the user never used before
version: 2
status: stable
severity: medium
confidence: low
mitre: [T1114, T1534]
tags: [bec, mail-send]
requires: []
requires_evidence: [mail_send]
sql: |
  WITH act AS (
    SELECT lower(u.user_upn) AS upn, u.event_time AS t, u.client_ip AS ip
    FROM ual_events u
    WHERE u.client_ip IS NOT NULL AND u.client_ip <> '' AND u.user_upn IS NOT NULL
    UNION ALL
    SELECT lower(s.user_upn), s.event_time, s.ip
    FROM signins s
    WHERE s.ip IS NOT NULL AND s.ip <> '' AND s.user_upn IS NOT NULL
  ),
  actn AS (
    SELECT a.upn, a.t, coalesce(CAST(i.asn AS VARCHAR), a.ip) AS net, i.country_iso AS cc
    FROM act a LEFT JOIN ip_intel i ON i.ip = a.ip
  ),
  first_ip AS (SELECT upn, ip, min(epoch_ms(t) // 86400000) AS first_d FROM act GROUP BY upn, ip),
  first_net AS (SELECT upn, net, min(epoch_ms(t) // 86400000) AS first_d FROM actn GROUP BY upn, net),
  first_cc AS (SELECT upn, cc, min(epoch_ms(t) // 86400000) AS first_d FROM actn WHERE cc IS NOT NULL GROUP BY upn, cc),
  days AS (SELECT upn, epoch_ms(t) // 86400000 AS d FROM actn GROUP BY upn, epoch_ms(t) // 86400000),
  sends AS (
    SELECT lower(CAST(u.record_id AS VARCHAR)) AS record_key, u.event_time, lower(u.user_upn) AS upn,
           u.user_upn AS actor_upn, u.client_ip AS ip,
           coalesce(CAST(i.asn AS VARCHAR), u.client_ip) AS net, i.country_iso AS cc,
           coalesce(i.is_hosting, false) AS hosting
    FROM ual_events u LEFT JOIN ip_intel i ON i.ip = u.client_ip
    WHERE lower(u.operation) IN ('send', 'sendas', 'sendonbehalf')
      AND u.client_ip IS NOT NULL AND u.client_ip <> '' AND u.user_upn IS NOT NULL
      AND NOT coalesce(i.is_microsoft, false)
  )
  SELECT s.record_key, 'ual_events' AS source_table, s.event_time, s.actor_upn, s.ip
  FROM sends s
  WHERE (SELECT count(*) FROM days d WHERE d.upn = s.upn AND d.d < epoch_ms(s.event_time) // 86400000) >= 3
    AND NOT EXISTS (SELECT 1 FROM first_ip f WHERE f.upn = s.upn AND f.ip = s.ip
                    AND f.first_d < epoch_ms(s.event_time) // 86400000)
    AND (s.hosting OR EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = s.ip)
         OR (NOT EXISTS (SELECT 1 FROM first_net f WHERE f.upn = s.upn AND f.net = s.net
                         AND f.first_d < epoch_ms(s.event_time) // 86400000)
             AND (s.cc IS NULL
                  OR NOT EXISTS (SELECT 1 FROM first_cc c WHERE c.upn = s.upn AND c.cc = s.cc
                                 AND c.first_d < epoch_ms(s.event_time) // 86400000)
                  OR EXISTS (SELECT 1 FROM signins r
                             WHERE lower(r.user_upn) = s.upn
                               AND lower(coalesce(r.risk_level_during, '')) IN ('medium', 'high')
                               AND epoch_ms(r.event_time) <= epoch_ms(s.event_time)
                               AND epoch_ms(r.event_time) >= epoch_ms(s.event_time) - 86400000))))
group_by: [actor_upn]
analyst_guidance: |
  A message sent from a network the user has not been seen on, within this case, and that is a
  hosting provider, a new country, the follow-up of a risky sign-in, or an address GeoIP could not
  place. It matters most when the address is the one of the sign-in the session is suspected of,
  or when the send follows a new inbox rule or an MFA change. Check the recipients and subject
  through the message trace.
false_positives:
  - A user travelling to a new country or using a VPN (a hosting ASN) for the first time.
  - A tenant captured without GeoIP data, where every new address is judged on history alone.
references:
  - https://learn.microsoft.com/en-us/purview/audit-mailboxes
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
author: Sparrow
