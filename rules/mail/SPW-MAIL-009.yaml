# SPW-MAIL-009 — Logic source: coverage.yaml. Inbound mail from a domain made to look like the
# tenant's own or like a correspondent's, the way a BEC actor registers `tcontoso.example` or a
# `vv` for a `w` so a payment thread continues from a "known" sender. `sql:` because it compares
# domains with each other and with the tenant's own (`tenant_domains`).
# Domains are compared as registrable domains: r = the last two labels of the sender host
# (lower(split_part(sender, '@', 2)), trailing dot dropped), so `em1234.vendorco.example` and
# `em1235.vendorco.example` are both `vendorco.example`, and two hosts with the same registrable
# domain are never a pair. The tenant's domains are reduced the same way. skeleton(x) folds the
# usual confusables: rn -> m, vv -> w, 0 -> o, 1 -> l, cl -> d. Two registrable domains look alike
# when their skeletons are equal, or when they share the TLD and their first labels are one edit
# apart (levenshtein = 1).
#   Arm A (tenant): r is not one of the tenant's registrable domains and looks like one of them.
#   Arm B (correspondent): r was first seen in message_trace at least 14 days AFTER a different
#   registrable domain k was first seen and looks like k (the look-alike came second, so it is the
#   imitation).
# Both arms need the first label of r to be at least 6 characters: short names (abcd.example /
# abce.example) are one edit apart by chance. A tenant domain is never a look-alike (not for arm B
# either: the tenant's own second domain is not an imitation of a vendor). When r matches both
# arms, arm A wins. The order is the only signal of which of two look-alike correspondents is the
# imitation: the later one, at least 14 days on, is the one reported; two domains first seen
# within 14 days of each other are not reported (the same pair reversed past 14 days would be).
# When several domains qualify as the original, the one seen first (then the alphabetically
# first) is named in `context.look_alike_of` (a registrable domain); `context.arm` is `tenant` or
# `correspondent`. One hit per trace row (one message and recipient); actor_upn is the recipient.
# Severity is a single level (the tenant arm is the stronger signal; the arm is in the context).
# A tenant with no known domain has no arm A. Missed on purpose: look-alikes two or more edits
# apart that no skeleton folds (other homoglyphs), a one-edit change in the TLD itself, and any
# domain whose first label is under 6 characters. Multi-part public suffixes (`co.uk`) make the
# registrable domain the suffix itself, so such senders compare on the suffix; likewise a tenant
# domain `contoso.onmicrosoft.com` makes every `*.onmicrosoft.com` sender the tenant's own.
# Cost: the pairs are never a cross join. Skeleton pairs are an equi-join on the skeleton; one-edit
# pairs are joined only within one TLD and one length class m (the shorter label's length; each
# label sits in the classes of its own length and of its length - 1), on the first floor(m/2)
# characters OR (a second equi-join, unioned) the last floor(m/2) characters. That key is exact
# for one edit: a single substitution, insertion or deletion at position i leaves the first
# floor(m/2) characters intact when i >= floor(m/2), and otherwise the last floor(m/2) (since
# i < floor(m/2) <= m - floor(m/2)). Only labels of 5 or more characters are paired this way (a
# candidate has 6, so its one-edit original has at least 5).
id: SPW-MAIL-009
title: Inbound mail from a look-alike domain
version: 1
status: experimental
severity: high
confidence: medium
mitre: [T1566.001, T1583.001]
tags: [bec, phishing, lookalike-domain]
# No `stage:` (like SPW-HAWK-014): inbound mail is not a compromise stage of the recipient.
requires: []
requires_evidence: []
sql: |
  WITH dom AS (
    SELECT DISTINCT lower(rtrim(trim(d.domain), '.')) AS d
    FROM tenant_domains d
    WHERE d.tenant_key = $tenant
  ),
  dom_r AS (
    SELECT DISTINCT coalesce(nullif(regexp_extract(d, '[^.]+\.[^.]+$'), ''), d) AS r
    FROM dom
    WHERE d <> ''
  ),
  mt AS (
    SELECT m.*, coalesce(nullif(regexp_extract(m.d, '[^.]+\.[^.]+$'), ''), m.d) AS r
    FROM (
      SELECT t.*, lower(rtrim(trim(split_part(t.sender, '@', 2)), '.')) AS d
      FROM message_trace t
      WHERE coalesce(trim(t.sender), '') <> ''
    ) m
  ),
  seen AS (
    SELECT r, min(received) AS first_seen
    FROM mt
    WHERE received IS NOT NULL AND r <> ''
    GROUP BY r
  ),
  names AS (
    SELECT r FROM seen
    UNION
    SELECT r FROM dom_r
  ),
  nm AS (
    SELECT r, split_part(r, '.', 1) AS lbl, substr(r, length(split_part(r, '.', 1)) + 1) AS tld,
           replace(replace(replace(replace(replace(r, 'rn', 'm'), 'vv', 'w'), '0', 'o'), '1', 'l'), 'cl', 'd') AS sk
    FROM names
  ),
  blk AS (
    SELECT r, lbl, tld, m, left(lbl, m // 2) AS pre, right(lbl, m // 2) AS suf
    FROM (
      SELECT r, lbl, tld, length(lbl) AS m FROM nm WHERE length(lbl) >= 5
      UNION ALL
      SELECT r, lbl, tld, length(lbl) - 1 FROM nm WHERE length(lbl) >= 6
    )
  ),
  edit_pairs AS (
    SELECT a.r AS a, b.r AS b, a.lbl AS al, b.lbl AS bl, a.m
    FROM blk a JOIN blk b ON a.tld = b.tld AND a.m = b.m AND a.pre = b.pre
    UNION
    SELECT a.r, b.r, a.lbl, b.lbl, a.m
    FROM blk a JOIN blk b ON a.tld = b.tld AND a.m = b.m AND a.suf = b.suf
  ),
  pairs AS (
    SELECT a, b FROM edit_pairs
    WHERE a <> b AND least(length(al), length(bl)) = m AND abs(length(al) - length(bl)) <= 1
      AND levenshtein(al, bl) = 1
    UNION
    SELECT a.r, b.r FROM nm a JOIN nm b ON a.sk = b.sk AND a.r <> b.r
  ),
  cand AS (
    SELECT s.r, s.first_seen FROM seen s
    WHERE length(split_part(s.r, '.', 1)) >= 6 AND s.r NOT IN (SELECT r FROM dom_r)
  ),
  arm_a AS (
    SELECT c.r AS d, t.r AS original,
           row_number() OVER (PARTITION BY c.r ORDER BY t.r) AS rn
    FROM cand c JOIN pairs p ON p.a = c.r JOIN dom_r t ON t.r = p.b
  ),
  arm_b AS (
    SELECT c.r AS d, k.r AS original,
           row_number() OVER (PARTITION BY c.r ORDER BY k.first_seen, k.r) AS rn
    FROM cand c JOIN pairs p ON p.a = c.r JOIN seen k ON k.r = p.b
    WHERE epoch_ms(k.first_seen) + 14 * 86400000 <= epoch_ms(c.first_seen)
  ),
  lookalikes AS (
    SELECT d, original, 'tenant' AS arm FROM arm_a WHERE rn = 1
    UNION ALL
    SELECT d, original, 'correspondent' FROM arm_b
    WHERE rn = 1 AND d NOT IN (SELECT d FROM arm_a)
  )
  SELECT m.record_key, 'message_trace' AS source_table, m.received AS event_time,
         m.recipient AS actor_upn, m.from_ip AS ip,
         json_object('look_alike_of', l.original, 'arm', l.arm, 'sender', m.sender,
                     'subject', m.subject) AS context
  FROM mt m
  JOIN lookalikes l ON m.r = l.d
  WHERE coalesce(trim(m.recipient), '') <> ''
group_by: [actor_upn]
analyst_guidance: |
  A message arrived from a domain that is one character off, or built from look-alike characters
  (rn for m, vv for w, 0 for o, 1 for l, cl for d), from the tenant's own domain or from a
  correspondent seen at least two weeks earlier. Open the record: the sender, the subject and
  the originating address. Compare the domain's registration date with the first message, check
  whether the thread asks for a payment, new bank details or a changed contact, and whether the
  recipient replied. `arm` says which it imitates: the tenant itself (internal impersonation) or
  a vendor or partner (invoice fraud).
false_positives:
  - A real sister company, a subsidiary or a franchise whose domain differs from a known one by one character.
  - A vendor that moved to a new domain after a rebrand and kept the old name nearly intact.
  - Two unrelated companies whose long names happen to be one edit apart (a numbered series of sites).
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1583/001/
  - https://learn.microsoft.com/en-us/defender-office-365/anti-phishing-policies-about
author: Sparrow
tests:
  - name: tenant contoso-example.example, sender tcontoso-example.example (arm A)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@tcontoso-example.example
        recipient: alice@contoso-example.example
    expect_hits: 1
  - name: vendor seen 30 days earlier, then a vv for w look-alike (arm B)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
    expect_hits: 1
  - name: arm A skeleton only (vv for w, two edits from the tenant domain)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: wideworld.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@vvideworld.example
        recipient: alice@wideworld.example
    expect_hits: 1
  - name: arm A skeleton only (cl for d)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: clarity-labs.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@darity-labs.example
        recipient: alice@clarity-labs.example
    expect_hits: 1
  - name: arm A skeleton only (rn for m, 0 for o, 1 for l)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: moonlight-media.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@rnoonlight-media.example
        recipient: alice@moonlight-media.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@m00n1ight-media.example
        recipient: bob@moonlight-media.example
    expect_hits: 2
  - name: short domains one edit apart (abcd.example / abce.example)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: a@abcd.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: a@abce.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: short first label, one edit from the tenant domain
    records:
      - table: tenant_domains
        tenant_key: test
        domain: acme.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@acne.example
        recipient: alice@acme.example
    expect_hits: 0
  - name: the tenant's own domain
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: bob@contoso-example.example
        recipient: alice@contoso-example.example
    expect_hits: 0
  - name: another tenant domain one edit from the primary is not a look-alike
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.example
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.test
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: bob@contoso-example.example
        recipient: alice@contoso-example.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: bob@contoso-example.test
        recipient: alice@contoso-example.example
    expect_hits: 0
  - name: look-alike seen before the original, original less than 14 days later (arm B order)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-02-08T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: look-alike first seen only 13 days after the original
    records:
      - table: message_trace
        received: "2026-02-20T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: look-alike first seen exactly 14 days after the original
    records:
      - table: message_trace
        received: "2026-02-19T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
    expect_hits: 1
  - name: unrelated long domains
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso.example
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@fabrikam-supplies.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: two hosts of one registrable domain 20 days apart (em1234 / em1235.vendorco.example)
    records:
      - table: message_trace
        received: "2026-02-13T09:00:00Z"
        sender: billing@em1234.vendorco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@em1235.vendorco.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: a subdomain of a look-alike is judged on its registrable domain (arm A)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@mail.widgetcorq.example
        recipient: alice@widgetcorp.example
    expect_hits: 1
  - name: a subdomain of the tenant's registrable domain is not a look-alike
    records:
      - table: tenant_domains
        tenant_key: test
        domain: widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@em1234.widgetcorp.example
        recipient: alice@widgetcorp.example
    expect_hits: 0
  - name: one-edit pairing is exact (substitution at 0, 4, 5, 9 of widgetcorp; key halves 5)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@xidgetcorp.example
        recipient: a1@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgxtcorp.example
        recipient: a2@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgexcorp.example
        recipient: a3@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgetcorx.example
        recipient: a4@widgetcorp.example
    expect_hits: 4
  - name: one-edit pairing is exact (insertion at 0, 4, 5, 10 of widgetcorp)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@xwidgetcorp.example
        recipient: a1@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgxetcorp.example
        recipient: a2@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgextcorp.example
        recipient: a3@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgetcorpx.example
        recipient: a4@widgetcorp.example
    expect_hits: 4
  - name: one-edit pairing is exact (deletion at 0, 3, 5, 9 of widgetcorp; key halves 4)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@idgetcorp.example
        recipient: a1@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widetcorp.example
        recipient: a2@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgecorp.example
        recipient: a3@widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgetcor.example
        recipient: a4@widgetcorp.example
    expect_hits: 4
  - name: one-edit pairing is exact for an odd-length correspondent (arm B; substitution at 0 and 3, insertion at 5, deletion at 2 and 8)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@northwind.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@xorthwind.example
        recipient: a1@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@northxwind.example
        recipient: a2@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@nothwind.example
        recipient: a3@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@northwin.example
        recipient: a4@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@norxhwind.example
        recipient: a5@contoso.example
    expect_hits: 5
  - name: one edit in the TLD itself is not paired (one-edit pairs need the same TLD)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: widgetcorp.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@widgetcorp.exampl
        recipient: alice@widgetcorp.example
    expect_hits: 0
