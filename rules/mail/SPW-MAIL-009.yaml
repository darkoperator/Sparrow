# SPW-MAIL-009 — Logic source: coverage.yaml. Inbound mail from a domain made to look like the
# tenant's own or like a correspondent's, the way a BEC actor registers `tcontoso.example` or a
# `vv` for a `w` so a payment thread continues from a "known" sender. `sql:` because it compares
# domains with each other and with the tenant's own (`tenant_domains`).
# The sender domain is d = lower(split_part(sender, '@', 2)). skeleton(x) folds the usual
# confusables: rn -> m, vv -> w, 0 -> o, 1 -> l, cl -> d. Two domains look alike when their
# skeletons are equal or they are one edit apart (levenshtein = 1).
#   Arm A (tenant): d is not one of the tenant's domains and looks like one of them.
#   Arm B (correspondent): d was first seen in message_trace at least 14 days AFTER a different
#   domain k was first seen and looks like k (the look-alike came second, so it is the imitation).
# Both arms need the first label of d to be at least 6 characters: short names (abcd.com /
# abce.com) are one edit apart by chance. A tenant domain is never a look-alike (not for arm B
# either: the tenant's own second domain is not an imitation of a vendor). When d matches both
# arms, arm A wins. The order is the only signal of which of two look-alike correspondents is the
# imitation: the later one, at least 14 days on, is the one reported; two domains first seen
# within 14 days of each other are not reported (the same pair reversed past 14 days would be).
# When several domains qualify as the original, the one seen first (then the alphabetically
# first) is named in `context.look_alike_of`; `context.arm` is `tenant` or
# `correspondent`. One hit per trace row (one message and recipient); actor_upn is the recipient.
# Severity is a single level (the tenant arm is the stronger signal; the arm is in the context).
# A tenant with no known domain has no arm A. Missed on purpose: look-alikes two or more edits
# apart that no skeleton folds (other homoglyphs), and any domain whose first label is under 6
# characters.
id: SPW-MAIL-009
title: Inbound mail from a look-alike domain
version: 1
status: experimental
severity: high
confidence: medium
mitre: [T1566.001, T1583.001]
tags: [bec, phishing, lookalike-domain]
# The schema has no `initial_access` stage; inbound phishing is the closest to an unexpected
# first contact in the sign-in roll-up (suspicious_sign_in), the earliest stage the schema has.
stage: suspicious_sign_in
requires: []
requires_evidence: []
sql: |
  WITH dom AS (
    SELECT DISTINCT lower(rtrim(trim(d.domain), '.')) AS d
    FROM tenant_domains d
    WHERE d.tenant_key = $tenant
  ),
  dom_sk AS (
    SELECT d, replace(replace(replace(replace(replace(d, 'rn', 'm'), 'vv', 'w'), '0', 'o'), '1', 'l'), 'cl', 'd') AS sk
    FROM dom
  ),
  seen AS (
    SELECT lower(trim(split_part(m.sender, '@', 2))) AS d, min(m.received) AS first_seen
    FROM message_trace m
    WHERE m.received IS NOT NULL AND coalesce(trim(m.sender), '') <> ''
    GROUP BY 1
  ),
  seen_sk AS (
    SELECT s.d, s.first_seen,
           replace(replace(replace(replace(replace(s.d, 'rn', 'm'), 'vv', 'w'), '0', 'o'), '1', 'l'), 'cl', 'd') AS sk
    FROM seen s
    WHERE s.d <> ''
  ),
  cand AS (
    SELECT s.* FROM seen_sk s
    WHERE length(split_part(s.d, '.', 1)) >= 6 AND s.d NOT IN (SELECT d FROM dom)
  ),
  arm_a AS (
    SELECT c.d, t.d AS original,
           row_number() OVER (PARTITION BY c.d ORDER BY t.d) AS rn
    FROM cand c JOIN dom_sk t ON c.sk = t.sk OR levenshtein(c.d, t.d) = 1
  ),
  arm_b AS (
    SELECT c.d, k.d AS original,
           row_number() OVER (PARTITION BY c.d ORDER BY k.first_seen, k.d) AS rn
    FROM cand c JOIN seen_sk k
      ON k.d <> c.d AND epoch_ms(k.first_seen) + 14 * 86400000 <= epoch_ms(c.first_seen)
     AND (c.sk = k.sk OR levenshtein(c.d, k.d) = 1)
  ),
  lookalikes AS (
    SELECT d, original, 'tenant' AS arm FROM arm_a WHERE rn = 1
    UNION ALL
    SELECT d, original, 'correspondent' FROM arm_b
    WHERE rn = 1 AND d NOT IN (SELECT d FROM arm_a)
  )
  SELECT m.record_key, 'message_trace' AS source_table, m.received AS event_time,
         m.recipient AS actor_upn, m.from_ip AS ip,
         json_object('look_alike_of', l.original, 'arm', l.arm, 'sender', m.sender,
                     'subject', m.subject) AS context
  FROM message_trace m
  JOIN lookalikes l ON lower(trim(split_part(m.sender, '@', 2))) = l.d
  WHERE coalesce(trim(m.recipient), '') <> ''
group_by: [actor_upn]
analyst_guidance: |
  A message arrived from a domain that is one character off, or built from look-alike characters
  (rn for m, vv for w, 0 for o, 1 for l, cl for d), from the tenant's own domain or from a
  correspondent seen at least two weeks earlier. Open the record: the sender, the subject and
  the originating address. Compare the domain's registration date with the first message, check
  whether the thread asks for a payment, new bank details or a changed contact, and whether the
  recipient replied. `arm` says which it imitates: the tenant itself (internal impersonation) or
  a vendor or partner (invoice fraud).
false_positives:
  - A real sister company, a subsidiary or a franchise whose domain differs from a known one by one character.
  - A vendor that moved to a new domain after a rebrand and kept the old name nearly intact.
  - Two unrelated companies whose long names happen to be one edit apart (a numbered series of sites).
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1583/001/
  - https://learn.microsoft.com/en-us/defender-office-365/anti-phishing-policies-about
author: Sparrow
tests:
  - name: tenant contoso-example.com, sender tcontoso-example.com (arm A)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.com
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@tcontoso-example.com
        recipient: alice@contoso-example.com
    expect_hits: 1
  - name: vendor seen 30 days earlier, then a vv for w look-alike (arm B)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
    expect_hits: 1
  - name: arm A skeleton only (vv for w, two edits from the tenant domain)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: wideworld.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@vvideworld.example
        recipient: alice@wideworld.example
    expect_hits: 1
  - name: arm A skeleton only (cl for d)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: clarity-labs.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@darity-labs.example
        recipient: alice@clarity-labs.example
    expect_hits: 1
  - name: arm A skeleton only (rn for m, 0 for o, 1 for l)
    records:
      - table: tenant_domains
        tenant_key: test
        domain: moonlight-media.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@rnoonlight-media.example
        recipient: alice@moonlight-media.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@m00n1ight-media.example
        recipient: bob@moonlight-media.example
    expect_hits: 2
  - name: short domains one edit apart (abcd.com / abce.com)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: a@abcd.com
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: a@abce.com
        recipient: alice@contoso.example
    expect_hits: 0
  - name: short first label, one edit from the tenant domain
    records:
      - table: tenant_domains
        tenant_key: test
        domain: acme.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: pay@acne.example
        recipient: alice@acme.example
    expect_hits: 0
  - name: the tenant's own domain
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.com
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: bob@contoso-example.com
        recipient: alice@contoso-example.com
    expect_hits: 0
  - name: another tenant domain one edit from the primary is not a look-alike
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.com
      - table: tenant_domains
        tenant_key: test
        domain: contoso-example.org
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: bob@contoso-example.com
        recipient: alice@contoso-example.com
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: bob@contoso-example.org
        recipient: alice@contoso-example.com
    expect_hits: 0
  - name: look-alike seen before the original, original less than 14 days later (arm B order)
    records:
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-02-08T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: look-alike first seen only 13 days after the original
    records:
      - table: message_trace
        received: "2026-02-20T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
    expect_hits: 0
  - name: look-alike first seen exactly 14 days after the original
    records:
      - table: message_trace
        received: "2026-02-19T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@vvidgetco.example
        recipient: alice@contoso.example
    expect_hits: 1
  - name: unrelated long domains
    records:
      - table: tenant_domains
        tenant_key: test
        domain: contoso.example
      - table: message_trace
        received: "2026-02-03T09:00:00Z"
        sender: billing@widgetco.example
        recipient: alice@contoso.example
      - table: message_trace
        received: "2026-03-05T09:00:00Z"
        sender: billing@fabrikam-supplies.example
        recipient: alice@contoso.example
    expect_hits: 0
