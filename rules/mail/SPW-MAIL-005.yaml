# SPW-MAIL-005 — MailItemsAccessed bind burst. Logic source: coverage.yaml ("at least 5
# MailItemsAccessed records with MailAccessType Bind, or at least 100 accessed items, for one
# mailbox from one client IP within 30 minutes. Sync records never count."), tuned: see below.
# A sliding 30 minute window per (mailbox, client IP) over the Bind records; the hits are every Bind
# record of a qualifying window. The `sql:` form is needed because the second clause sums accessed
# items, which the `threshold:` block (a row count) cannot express.
# Tuning. Outlook desktop and mobile, search and shared mailboxes bind far more than 5 items per
# half hour on an ordinary day (Microsoft Learn, audit-mailitemsaccessed: MailItemsAccessed records
# every mail item a client reads; Bind is the per-item access and Sync the bulk download), so the
# burst alone is background for most users. A burst now counts only when the address it comes from
# is outside the user's normal networks:
#   - the accessing user must have sign-in history in the case (successful sign-ins on at least 3
#     distinct days) and the burst's network - the ASN from ip_intel, else the address itself when
#     ip_intel has no ASN - must not be one the user signed in from on at least 3 distinct days.
#     History and regular networks count ONLY days strictly before the burst's UTC day, so the
#     attacker's own dwell after the burst, or a multi-day token refresh, never makes the attacker's
#     network regular. A successful sign-in is error_code 0 or NULL (the result is unknown, the
#     evidence is kept rather than dropped); a NULL that was really a failure can only add history
#     from earlier days, which is an acceptable trade-off;
#   - or the address is a hosting ASN (ip_intel.is_hosting) or a password-spray source of the tenant
#     (spray_sources: compromised ISP routers and residential proxies are not hosting ASNs),
#     whatever the user's history;
#   - a Microsoft service front end (ip_intel.is_microsoft) never counts as a foreign network.
# A user with no sign-in history in the case is judged by the hosting test alone (their normal
# networks cannot be known); that is deliberate and documented. One finding per (mailbox, UTC day),
# so an attacker reading one mailbox from several addresses on a day is one finding (the context
# lists the addresses). Missed on purpose: a token thief
# reading mail from a residential or business ISP the user has also signed in from on 3 or more days
# (SPW-ID-004, SPW-MAIL-003 and the other session rules cover the session itself).
id: SPW-MAIL-005
title: MailItemsAccessed bind burst
version: 2
status: stable
severity: high
confidence: medium
mitre: [T1114.002]
tags: [bec, mail-access]
requires: []
requires_evidence: [mail_items_accessed]
sql: |
  WITH signn AS (
    SELECT DISTINCT lower(s.user_upn) AS upn, epoch_ms(s.event_time) // 86400000 AS d,
           coalesce(CAST(i.asn AS VARCHAR), s.ip) AS net
    FROM signins s LEFT JOIN ip_intel i ON i.ip = s.ip
    WHERE (s.error_code IS NULL OR s.error_code = 0) AND s.ip IS NOT NULL AND s.ip <> ''
      AND s.user_upn IS NOT NULL AND s.event_time IS NOT NULL
  ),
  bind AS (
    SELECT u.record_id, u.event_time, coalesce(u.mailbox_upn, u.user_upn) AS mailbox,
           u.client_ip AS ip, count(*) AS items
    FROM ual_events u JOIN mail_items_accessed m ON m.record_id = u.record_id
    LEFT JOIN ip_intel i ON i.ip = u.client_ip
    WHERE m.access_type = 'bind' AND NOT coalesce(i.is_microsoft, false)
      AND (coalesce(i.is_hosting, false)
           OR EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = u.client_ip)
           -- History and regular networks count only days strictly BEFORE the burst's UTC day.
           OR ((SELECT count(DISTINCT x.d) FROM signn x
                WHERE x.upn = lower(u.user_upn) AND x.d < epoch_ms(u.event_time) // 86400000) >= 3
               AND (SELECT count(DISTINCT x.d) FROM signn x
                    WHERE x.upn = lower(u.user_upn)
                      AND x.net = coalesce(CAST(i.asn AS VARCHAR), u.client_ip)
                      AND x.d < epoch_ms(u.event_time) // 86400000) < 3))
    GROUP BY u.record_id, u.event_time, coalesce(u.mailbox_upn, u.user_upn), u.client_ip
  ),
  windowed AS (
    SELECT *, count(*) OVER win AS records, sum(items) OVER win AS total_items
    FROM bind
    WINDOW win AS (PARTITION BY mailbox, ip ORDER BY epoch_ms(event_time)
                   RANGE BETWEEN 1800000 PRECEDING AND CURRENT ROW)
  ),
  burst AS (SELECT * FROM windowed WHERE records >= 5 OR total_items >= 100)
  SELECT lower(CAST(b.record_id AS VARCHAR)) AS record_key, 'ual_events' AS source_table,
         b.event_time, b.mailbox AS actor_upn, b.ip AS ip,
         json_object('day', strftime(epoch_ms(epoch_ms(b.event_time)), '%Y-%m-%d'),
                     'addresses', list_sort(list(DISTINCT b.ip) OVER (
                       PARTITION BY b.mailbox, epoch_ms(b.event_time) // 86400000))) AS context
  FROM bind b
  WHERE EXISTS (
    SELECT 1 FROM burst q
    WHERE q.mailbox IS NOT DISTINCT FROM b.mailbox AND q.ip IS NOT DISTINCT FROM b.ip
      AND epoch_ms(b.event_time) <= epoch_ms(q.event_time)
      AND epoch_ms(b.event_time) >= epoch_ms(q.event_time) - 1800000
  )
group_by: [actor_upn, day]
analyst_guidance: |
  A burst of MailItemsAccessed Bind records from one address is what a token thief reading a
  mailbox through Graph or EWS looks like. Compare the client IP and app id with the user's
  normal sign-ins, check which folders were read, and look for a preceding risky sign-in or a new
  app consent.
false_positives:
  - A migration or backup tool reading a mailbox through a service account.
  - A user's own device after a long offline period (mostly Sync, which never counts).
references:
  - https://learn.microsoft.com/en-us/purview/audit-mailitemsaccessed
author: Sparrow
