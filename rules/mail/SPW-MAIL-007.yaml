# SPW-MAIL-007 — Logic source: coverage.yaml ("search_queries (or UAL
# SearchQueryInitiatedExchange / SearchQueryInitiatedSharePoint) whose query_text hits
# @list:finance_keywords."). `sql:` because the UAL arm reads the query text out of the
# audit_data JSON, which a `match:` cannot address (it only reaches real columns and MAP keys);
# the `search_queries` side table is read directly. `contains_any` is a substring test, which is
# what "hits" means for a search box: "invoice" inside "vendor invoices 2026" is a hit. The UAL
# side reads the query text the way the normalizer reads it (the QueryText, SearchQuery or Query
# property, whatever its case) and accepts every operation name the normalizer recognises as a
# search (SearchQueryInitiated, SearchQueryInitiatedExchange, SearchQueryInitiatedSharePoint,
# SharepointSearchQueryInitiated), so a record the normalizer called a search is one here too.
# A record that has a `search_queries` row is read from that row only, so one search is one hit.
id: SPW-MAIL-007
title: Mailbox or SharePoint search for finance keywords
version: 1
status: stable
severity: medium
confidence: medium
mitre: [T1114.002, T1114.003]
tags: [bec, search, data-exfiltration]
stage: mail_access
requires: []
requires_evidence: [search_queries]
sql: |
  -- A mailbox or SharePoint search whose text hits a finance keyword. The query text is read
  -- from the UAL AuditData (QueryText) and from the derived `search_queries` row, so a capture
  -- carrying either one is covered; each hit is keyed on the UAL record id, the key the side
  -- table joins on and the key a storyline attests. Substring matching is what "hits" means for
  -- a search box: "invoice" inside "vendor invoices 2026" is a hit.
  -- One search, one hit. The query text is the side table's reading of the record where it has
  -- one (the normalizer's own), read the way the normalizer reads it: the QueryText, SearchQuery
  -- or Query property, whatever its case. A record whose side-table row carries no text is read
  -- from its own AuditData. The hit key is always the UAL record id and search_queries is derived
  -- from ual_events, so the evidence points at the UAL record (source_table ual_events)
  -- whichever table supplied the text.
  WITH searches AS (
    -- The side table has the text.
    SELECT u.record_id, u.event_time, u.user_upn, u.client_ip, s.query_text
    FROM ual_events u
    JOIN search_queries s ON s.record_id = u.record_id
    WHERE nullif(trim(coalesce(s.query_text, '')), '') IS NOT NULL
    UNION ALL
    -- No side-table text: the operations the normalizer recognises as a search (normalize/ual.rs:
    -- search), read out of the record's own AuditData.
    SELECT u.record_id, u.event_time, u.user_upn, u.client_ip,
           coalesce((SELECT string_agg(j.value, ' ') FROM json_each(u.audit_data) j
                     WHERE lower(j.key) IN ('querytext', 'searchquery', 'query')), '')
    FROM ual_events u
    WHERE lower(u.operation) IN ('searchqueryinitiated', 'searchqueryinitiatedexchange',
                                 'searchqueryinitiatedsharepoint',
                                 'sharepointsearchqueryinitiated')
      AND NOT EXISTS (SELECT 1 FROM search_queries s
                      WHERE s.record_id = u.record_id
                        AND nullif(trim(coalesce(s.query_text, '')), '') IS NOT NULL)
  )
  SELECT lower(CAST(q.record_id AS VARCHAR)) AS record_key,
         'ual_events' AS source_table,
         q.event_time, q.user_upn AS actor_upn, q.client_ip AS ip
  FROM searches q
  WHERE len(list_filter(@list:finance_keywords,
          k -> k <> '' AND strpos(lower(coalesce(q.query_text, '')), lower(k)) > 0)) > 0
group_by: [actor_upn]
analyst_guidance: |
  A user (or an actor using their session) searching the mailbox or SharePoint for invoice,
  payment, wire, bank and similar terms is the reconnaissance or the collection step of a BEC
  thread: the actor is looking for the thread to hijack or the money to redirect. Check who ran
  the search, from where, and what followed - a reply, a rule, a forward.
false_positives:
  - A finance or payroll user searching for the same terms as part of their job.
references:
  - https://learn.microsoft.com/en-us/purview/audit-mail-search
author: Sparrow
tests:
  - name: the derived search_queries row of an invoice search is a hit
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070001"
        operation: SearchQueryInitiatedExchange
        workload: Exchange
        user_upn: victim@contoso.example
        event_time: "2026-03-05T08:00:00Z"
      - table: search_queries
        record_id: "00000000-0000-0000-0000-000000070001"
        workload: exchange
        query_text: "invoice payment wire transfer"
    expect_hits: 1
  - name: a UAL SearchQueryInitiatedExchange for bank details is a hit
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070002"
        operation: SearchQueryInitiatedExchange
        workload: exchange
        user_upn: victim@contoso.example
        audit_data: {QueryText: "bank details"}
        event_time: "2026-03-05T09:00:00Z"
    expect_hits: 1
  - name: a benign search for a team offsite is not a hit
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070003"
        operation: SearchQueryInitiatedExchange
        workload: Exchange
        user_upn: quiet@contoso.example
        audit_data: {QueryText: "team offsite agenda"}
        event_time: "2026-03-05T11:00:00Z"
      - table: search_queries
        record_id: "00000000-0000-0000-0000-000000070003"
        workload: exchange
        query_text: "team offsite agenda"
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070004"
        operation: SearchQueryInitiatedExchange
        workload: exchange
        user_upn: quiet@contoso.example
        audit_data: {QueryText: "team offsite agenda"}
        event_time: "2026-03-05T10:00:00Z"
    expect_hits: 0
  - name: a UAL SearchQueryInitiated with no suffix is a hit
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070003"
        operation: SearchQueryInitiated
        workload: exchange
        user_upn: victim@contoso.example
        audit_data: {QueryText: "invoice payment"}
        event_time: "2026-03-05T08:00:00Z"
    expect_hits: 1
  - name: a UAL SharepointSearchQueryInitiated is a hit
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070004"
        operation: SharepointSearchQueryInitiated
        workload: sharepoint
        user_upn: victim@contoso.example
        audit_data: {QueryText: "bank details"}
        event_time: "2026-03-05T08:00:00Z"
    expect_hits: 1
  - name: a search is one hit, from the side table when it has one
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070005"
        operation: SearchQueryInitiatedExchange
        workload: exchange
        user_upn: victim@contoso.example
        audit_data: {QueryText: "invoice payment"}
        event_time: "2026-03-05T08:00:00Z"
      - table: search_queries
        record_id: "00000000-0000-0000-0000-000000070005"
        workload: exchange
        query_text: "invoice payment"
    expect_hits: 1
  - name: the query text is read the way the normalizer reads it
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070006"
        operation: SearchQueryInitiatedExchange
        workload: exchange
        user_upn: victim@contoso.example
        # A lower-case key and the SearchQuery spelling, both of which the normalizer accepts.
        audit_data: '{"searchquery":"invoice payment"}'
        event_time: "2026-03-05T08:00:00Z"
    expect_hits: 1
  - name: a search whose side-table row has no text is still one hit
    records:
      - table: ual_events
        record_id: "00000000-0000-0000-0000-000000070007"
        operation: SearchQueryInitiatedExchange
        workload: exchange
        user_upn: victim@contoso.example
        audit_data: {QueryText: "invoice payment"}
        event_time: "2026-03-05T08:00:00Z"
      - table: search_queries
        record_id: "00000000-0000-0000-0000-000000070007"
        workload: exchange
        query_text: ""
    expect_hits: 1
