# Microsoft Entra sign-in error codes that are rejected credentials: the codes a password spray
# produces. One shared list: the profile step's spray_sources relation, SPW-ID-005 and SPW-ID-006 all
# read it, so the definition of "a failed credential" lives in one place. Conditional Access blocks
# (53003), token-refresh errors (70043, 50173), Seamless SSO errors and MFA prompts are NOT credential
# failures. Reference: Microsoft Entra authentication and authorization error codes
# https://learn.microsoft.com/entra/identity-platform/reference-error-codes (each code below is
# described there). Smart lockout (50053): https://learn.microsoft.com/entra/identity/authentication/howto-password-smart-lockout
name: credential_failure_codes
description: >-
  Entra sign-in error codes for rejected credentials (invalid or unknown user, invalid password,
  lockout, expired or disabled account); contains no customer or capture data.
values:
  # AADSTS50126 InvalidUserNameOrPassword - invalid username or password
  - "50126"
  # AADSTS50053 IdsLocked - the account is locked (smart lockout after repeated bad passwords)
  - "50053"
  # AADSTS50034 UserAccountNotFound - the account does not exist in the directory
  - "50034"
  # AADSTS50056 invalid or null password - the password does not exist in the directory
  - "50056"
  # AADSTS50064 CredentialAuthenticationError - credential validation failed
  - "50064"
  # AADSTS50055 InvalidPasswordExpiredPassword - the password is expired
  - "50055"
  # AADSTS50057 UserDisabled - the account is disabled
  - "50057"
