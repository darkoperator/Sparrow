# Autonomous systems of hosting, cloud and VPS providers. A sign-in or mailbox access from
# one of them is unusual for an ordinary user (spec §8.5 "sign-in from hosting ASN").
# Curated seed, as_of 2026-10-27; extend with --rules DIR (lists/hosting_asns.yaml, entries
# replace built-ins by asn). Deliberately absent: Microsoft AS8075 (Microsoft 365 and Azure
# share it; ip_intel.is_microsoft covers Microsoft 365 service ranges) and Cloudflare AS13335
