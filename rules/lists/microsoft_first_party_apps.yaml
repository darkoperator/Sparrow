# Microsoft first-party application (client) ids. Public identifiers; no customer data.
# Every id below is copied from a public Microsoft Learn page, none is guessed:
#   [P] https://learn.microsoft.com/power-platform/admin/apps-to-allow
#       ("Commonly used Microsoft first-party services and portal apps")
#   [V] https://learn.microsoft.com/troubleshoot/entra/entra-id/governance/verify-first-party-apps-sign-in
#       ("Application IDs of Microsoft tenant-owned applications")
#   [O] https://learn.microsoft.com/entra/identity/conditional-access/reference-office-365-application-contents
#       (the Office 365 app suite; it names the apps but gives no ids, so each Office 365 app here takes
#       its id from [P] or [H])
#   [H] https://learn.microsoft.com/microsoft-365/document-collaboration-partner-program/scenarios/start-page
#       (the id of OfficeHome, the one required app none of the three pages above gives an id for)
# Used by the cloud_services profile (a first-party app is never a tenant-wide cloud service: phished
# accounts used from a VPS sign in to Office, Outlook and Teams, and a real SaaS connector is a
# third-party application) and by the sparrow-synth oracle. Extend or replace with --rules DIR
# (lists/microsoft_first_party_apps.yaml replaces this file). as_of 2026-10-05.
name: microsoft_first_party_apps
description: >-
  Public Microsoft first-party application ids (Office, Outlook, Exchange Online, SharePoint,
  Teams, OneDrive, Azure and Graph tooling) from Microsoft Learn; an (application, hosting ASN)
  pair of one of them is never a tenant-wide cloud service. Contains no customer or capture data.
