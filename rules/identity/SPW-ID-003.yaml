    records:
      - table: ip_intel
        ip: 198.51.100.1
        latitude: 48.85
        longitude: 2.35
      - table: ip_intel
        ip: 203.0.113.2
        latitude: -26.2
        longitude: 28.0
      - table: signins
        user_upn: alice@contoso.example
        ip: 198.51.100.1
        event_time: "2026-03-01T09:00:00Z"
        error_code: 0
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.2
        event_time: "2026-03-01T09:40:00Z"
        error_code: 0
    expect_hits: 2
