# SPW-ID-003 — impossible travel. Logic source: coverage.yaml ("Two successful sign-ins of one
# user whose locations (ip_intel latitude/longitude) imply a speed above 900 km/h, both at least
# 500 km from each other").
#
# How it is decided:
# - Events: successful sign-ins (signins error_code 0, or NULL: an unknown result is not a failure
#   and is kept rather than silently dropped) and UAL UserLoggedIn of one user (case
#   insensitive), located through ip_intel (latitude and longitude both known).
# - Consecutive: per user in time order (ties by table and record key), each event is compared
#   with the event just before it, and only when the address changed. Duplicates of one sign-in
#   (a signins row and its UAL record) are the same address, so they never form a pair.
# - Distance: great circle (haversine, Earth radius 6371 km) between the two ip_intel points.
# - Thresholds: distance >= 500 km AND implied speed > 900 km/h. 900 km/h is a commercial jet's
#   cruise speed; nobody travels faster between two sign-ins. 500 km keeps GeoIP city-level error
#   (tens to a few hundred km) and neighbouring-metro egress from counting.
# - Time floor: the gap is taken as at least 60 seconds, so two sign-ins in the same second from
#   far apart are a very high speed, never a division by zero.
# - Same country: a pair whose two addresses both geolocate to the same country counts only when
#   one end is a hosting address (ip_intel.is_hosting) or a password-spray source of the tenant
#   (spray_sources). City-level geolocation of national ISPs, mobile carriers and IPv6 space is
#   unreliable inside a country (distances of 1,000-3,000 km between a home ISP and a carrier are
#   routine), so a same-country pair between ordinary networks is not evidence. A pair across
#   countries counts as before, and so does a pair where either country is unknown. Missed on
#   purpose: a same-country attacker on an ordinary ISP with no spray history.
# - Skipped on purpose: the sign-ins of a tenant-wide cloud service to its application from its hosting
#   ASN (the tenant's `cloud_services` relation, one row per application and ASN, established from the
#   WHOLE case, the same definition SPW-ID-002 uses: 5 or more users with known successes from the ASN
#   on 3 or more days, 80% of the application's successes; interactive and non-interactive both count,
#   the portal export records a connector's backend as interactive), because its backend signs users in
#   from a cloud region on their behalf and that is not the user travelling. The UAL UserLoggedIn arm
#   applies the same exclusion by ual_events.app_id (a connector's backend may write logon records too);
#   the same application from another ASN, a logon with no application id and a sign-in or logon from a
#   password-spray source always count. A Microsoft first-party application (rules/lists/
#   microsoft_first_party_apps.yaml) is never a service (see SPW-ID-002). An (application, ASN) is NOT a service when (a) sprayed users are
#   at least 20% of its users or at least 3 of them are sprayed, or (b) at least 3 distinct users have an
#   interactive credential failure to the application from that ASN. Residual: an attacker on the same
#   application from the same ASN as an established connector is excused, and so are 5 or more PHISHED
#   (not sprayed) accounts used from one VPS on one application for 3 or more days with no failures, up to
#   2 distinct failing users, and up to 2 sprayed users while they are under 20% of the pair's users (only
#   when the pair has 11 or more users): those sprayed accounts, used from the connector's own
#   (application, ASN) from an address that is not a spray source, are reported by neither ID-002, ID-003
#   nor SPW-ID-005 (ID-005 reads only successes from a spray-source address).
#   Microsoft addresses (ip_intel.is_microsoft): Exchange Online, a Cloud PC
#   or a Microsoft relay geolocate to a datacentre unrelated to the user. Addresses with no
#   location are ignored, not treated as far.
# - Known false positives: VPNs and mobile-carrier egress (the address geolocates to the
#   carrier's gateway, often a different region), and split-tunnel VPN where two paths are live.
#   The rule cannot tell these apart; the analyst guidance says how to.
# - One event of a flagged pair is the hit: the LATER one (the sign-in that could not have been
#   reached), except that when only the EARLIER one is from a hosting address (ip_intel.is_hosting)
#   the hosting one is the hit, because the other is where the user normally signs in. The other
#   end (record key, table, time, address, coordinates) is in the context, so a routine sign-in
#   that merely sits next to a suspicious one is never the trigger.
# `sql:` because the pair needs a window over the user's sign-ins joined to ip_intel.
id: SPW-ID-003
title: Impossible travel
version: 4
status: stable
severity: medium
confidence: low
mitre: [T1078.004]
tags: [bec, sign-in, travel]
stage: suspicious_sign_in
requires: []
requires_evidence: []
needs_geoip: true
sql: |
  WITH ev AS (
    SELECT s.record_key, 'signins' AS src, s.event_time AS t, lower(s.user_upn) AS usr,
           s.user_upn AS actor, s.ip AS ip, i.latitude AS lat, i.longitude AS lon,
           coalesce(i.is_hosting, false) AS host, i.country_iso AS cc,
           EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = s.ip) AS spray
    FROM signins s JOIN ip_intel i ON i.ip = s.ip
    WHERE (s.error_code IS NULL OR s.error_code = 0) AND s.user_upn IS NOT NULL AND s.event_time IS NOT NULL
      AND i.latitude IS NOT NULL AND i.longitude IS NOT NULL AND NOT coalesce(i.is_microsoft, false)
      AND NOT EXISTS (SELECT 1 FROM cloud_services c
                      WHERE c.app_id = lower(coalesce(s.app_id, '')) AND c.asn = i.asn
                        AND NOT EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = s.ip))
    UNION ALL
    SELECT lower(CAST(u.record_id AS VARCHAR)), 'ual_events', u.event_time, lower(u.user_upn),
           u.user_upn, u.client_ip, i.latitude, i.longitude, coalesce(i.is_hosting, false),
           i.country_iso, EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = u.client_ip)
    FROM ual_events u JOIN ip_intel i ON i.ip = u.client_ip
    WHERE lower(u.operation) = 'userloggedin' AND u.user_upn IS NOT NULL
      AND i.latitude IS NOT NULL AND i.longitude IS NOT NULL AND NOT coalesce(i.is_microsoft, false)
      -- The same exclusion as the sign-in arm, by ual_events.app_id; a logon with no application id
      -- is never excused.
      AND NOT EXISTS (SELECT 1 FROM cloud_services c
                      WHERE c.app_id = lower(coalesce(u.app_id, '')) AND c.asn = i.asn
                        AND NOT EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = u.client_ip))
  ),
  seq AS (
    SELECT *,
           lag(record_key) OVER w AS p_key, lag(src) OVER w AS p_src, lag(t) OVER w AS p_t,
           lag(actor) OVER w AS p_actor, lag(ip) OVER w AS p_ip,
           lag(lat) OVER w AS p_lat, lag(lon) OVER w AS p_lon, lag(host) OVER w AS p_host,
           lag(cc) OVER w AS p_cc, lag(spray) OVER w AS p_spray
    FROM ev
    WINDOW w AS (PARTITION BY usr ORDER BY epoch_ms(t), src, record_key)
  ),
  pairs AS (
    SELECT *,
           2 * 6371 * asin(sqrt(least(1.0,
               sin(radians(lat - p_lat) / 2) * sin(radians(lat - p_lat) / 2)
               + cos(radians(p_lat)) * cos(radians(lat))
                 * sin(radians(lon - p_lon) / 2) * sin(radians(lon - p_lon) / 2)))) AS km,
           greatest((epoch_ms(t) - epoch_ms(p_t)) / 1000.0, 60.0) / 3600.0 AS hours
    FROM seq
    WHERE p_key IS NOT NULL AND p_ip <> ip
  ),
  flagged AS (
    SELECT *, (p_host AND NOT host) AS swap FROM pairs
    WHERE km >= 500 AND km / hours > 900
      -- A same-country pair is GeoIP jitter unless an end is attacker infrastructure: city-level
      -- geolocation of national ISPs, mobile carriers and IPv6 space is unreliable inside a
      -- country. An unknown country on either end cannot be called the same country.
      AND (host OR p_host OR spray OR p_spray OR cc IS NULL OR p_cc IS NULL OR cc <> p_cc)
  ),
  -- The trigger is the later sign-in, except when only the earlier one is a hosting address: the
  -- hosting side is then the odd one out (the other is where the user normally is), and it is the
  -- trigger. The other end of the pair is in the context either way.
  trig AS (
    SELECT CASE WHEN swap THEN p_key ELSE record_key END AS tkey,
           CASE WHEN swap THEN p_src ELSE src END AS tsrc,
           CASE WHEN swap THEN p_t ELSE t END AS tt,
           CASE WHEN swap THEN p_actor ELSE actor END AS tactor,
           CASE WHEN swap THEN p_ip ELSE ip END AS tip,
           CASE WHEN swap THEN record_key ELSE p_key END AS okey,
           CASE WHEN swap THEN src ELSE p_src END AS osrc,
           CASE WHEN swap THEN t ELSE p_t END AS ot,
           CASE WHEN swap THEN ip ELSE p_ip END AS oip,
           CASE WHEN swap THEN lat ELSE p_lat END AS olat,
           CASE WHEN swap THEN lon ELSE p_lon END AS olon,
           km, km / hours AS kmh
    FROM flagged
  ),
  -- One row per trigger: a sign-in that is the odd one out of two pairs (home, far, home) is
  -- reported once, with its fastest pair (ties by the other record's key), so the result never
  -- depends on which duplicate is kept.
  ranked AS (
    SELECT *, row_number() OVER (PARTITION BY tkey, tsrc ORDER BY kmh DESC, okey) AS rn FROM trig
  )
  SELECT r.tkey AS record_key,
         CASE WHEN r.tsrc = 'signins' THEN 'signins' ELSE 'ual_events' END AS source_table,
         r.tt AS event_time, r.tactor AS actor_upn, r.tip AS ip,
         json_object('distance_km', round(r.km), 'speed_kmh', round(r.kmh),
                     'other_record_key', r.okey, 'other_table', r.osrc,
                     'other_time_epoch_ms', epoch_ms(r.ot), 'other_ip', r.oip,
                     'other_lat', r.olat, 'other_lon', r.olon) AS context
  FROM ranked r
  WHERE r.rn = 1
group_by: [actor_upn]
analyst_guidance: |
  Two successful sign-ins of one user, from places too far apart to have travelled between
  (over 900 km/h and at least 500 km). The hit is the later sign-in (the hosting one when only
  the earlier is a hosting address); the context gives the distance, the implied speed and the
  other sign-in (record, time, address, coordinates).
  First rule out the common false positives: a VPN or a mobile carrier whose egress sits in
  another region, and a user signing in from a phone and a laptop on different networks. What
  usually separates an attacker is the rest of the session: an unfamiliar device or user agent,
  a hosting-provider address, a risk detection, or a mailbox logon from the far address.
false_positives:
  - VPN or mobile-carrier egress geolocating far from the user.
  - Two devices of one user on different networks (home broadband and a phone on cellular), when their countries are unknown or differ.
references:
  - https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
author: Sparrow
