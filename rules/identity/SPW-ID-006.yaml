# SPW-ID-006 — password spray against the tenant. One finding per tenant per UTC day of spray
# activity, low severity and high confidence: an internet-wide spray (legacy-auth BAV2ROPC or a
# scripted client, mostly 50053 smart lockout and 50126 invalid password) hits almost every tenant
# that still exposes password authentication, so the finding is the picture of the day, not an
# incident. SPW-ID-005 is the escalation: a source that later signed in. The sources are the
# tenant's `spray_sources` relation (an address that failed against at least 5 distinct users and
# is not regular egress; any network type), derived once by the profile step. The failed sign-ins
# that count are the interactive rows with a code of the shared `credential_failure_codes` list (the
# same list as the relation and SPW-ID-005; Conditional Access blocks, token-refresh errors, MFA
# prompts and non-interactive rows are not spray). A hit is the first failed sign-in of each source on the
# day (one record per source and day keeps the evidence small); the finding's context carries the
# tenant-level picture: sources, users targeted, failures, the top error codes, how many sources
# were hosting addresses versus other networks, and whether any source later succeeded (see
# SPW-ID-005). The finding has no actor: it is about the tenant, and group_by is the day.
id: SPW-ID-006
title: Password spray against the tenant
version: 1
status: stable
severity: low
confidence: high
mitre: [T1110.003]
tags: [bec, sign-in, password-spray]
requires: []
requires_evidence: []
min_signin_users: 5
sql: |
  WITH f AS (
    SELECT s.record_key, s.event_time AS t, lower(s.user_upn) AS usr, s.ip, s.error_code,
           epoch_ms(s.event_time) // 86400000 AS day
    FROM signins s JOIN spray_sources p ON p.ip = s.ip
    WHERE list_contains(@list:credential_failure_codes, CAST(s.error_code AS VARCHAR))
      AND coalesce(s.is_interactive, false)
      AND s.event_time IS NOT NULL AND s.user_upn IS NOT NULL
  ),
  codes AS (
    SELECT day, error_code, count(*) AS n,
           row_number() OVER (PARTITION BY day ORDER BY count(*) DESC, error_code) AS rk
    FROM f GROUP BY day, error_code
  ),
  top_codes AS (
    SELECT day, string_agg(CAST(error_code AS VARCHAR) || ':' || CAST(n AS VARCHAR), ', ' ORDER BY rk) AS top
    FROM codes WHERE rk <= 3 GROUP BY day
  ),
  per_day AS (
    SELECT f.day, count(DISTINCT f.ip) AS sources, count(DISTINCT f.usr) AS users,
           count(*) AS failures,
           count(DISTINCT f.ip) FILTER (WHERE coalesce(i.is_hosting, false)) AS hosting_sources
    FROM f LEFT JOIN ip_intel i ON i.ip = f.ip
    GROUP BY f.day
  ),
  later AS (
    SELECT DISTINCT p.ip
    FROM spray_sources p JOIN signins s ON s.ip = p.ip
    WHERE s.error_code = 0 AND s.event_time >= p.first_failure
  ),
  first_of AS (
    SELECT day, ip, arg_min(record_key, t) AS record_key, min(t) AS t
    FROM f GROUP BY day, ip
  )
  SELECT o.record_key, 'signins' AS source_table, o.t AS event_time,
         CAST(NULL AS VARCHAR) AS actor_upn, o.ip AS ip,
         json_object('day', strftime(epoch_ms(d.day * 86400000), '%Y-%m-%d'),
                     'sources', d.sources, 'users_targeted', d.users, 'failures', d.failures,
                     'top_error_codes', c.top,
                     'hosting_sources', d.hosting_sources,
                     'other_network_sources', d.sources - d.hosting_sources,
                     'any_source_later_succeeded',
                       EXISTS (SELECT 1 FROM later l WHERE l.ip IN (SELECT ip FROM first_of x WHERE x.day = d.day))) AS context
  FROM first_of o JOIN per_day d ON d.day = o.day JOIN top_codes c ON c.day = o.day
group_by: [day]
analyst_guidance: |
  Failed sign-ins from addresses that tried several of the tenant's users: a password spray. It is
  background noise on the internet, so the finding is the day's picture: how many sources and
  users, the dominant error codes (50053 lockout, 50126 invalid password) and whether the sources
  were hosting providers or ordinary ISPs (compromised routers and residential proxies). Check the
  `any_source_later_succeeded` flag: when true, SPW-ID-005 has the successful sign-in; otherwise
  confirm legacy authentication is blocked and smart lockout is on.
false_positives:
  - A tenant office whose egress sprays itself (a misconfigured sync client retrying a stale password for many accounts) when fewer than 5 users sign in from it on 3 days.
  - A vulnerability scanner or a penetration test the tenant authorised.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-sign-ins-error-codes
author: Sparrow
