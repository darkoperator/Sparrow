        ip: 203.0.113.1
        is_interactive: true
        error_code: 0
        auth_requirement: multiFactorAuthentication
        session_id: s-1
        event_time: "2026-03-01T09:00:00Z"
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.2
        is_interactive: false
        session_id: s-1
        event_time: "2026-03-01T09:03:00Z"
    expect_hits: 1
