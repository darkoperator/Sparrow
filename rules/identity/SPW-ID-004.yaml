# SPW-ID-004 — adversary-in-the-middle indicators. Logic source: coverage.yaml ("A session
# (session_id / AADSessionId) used from an IP or ASN different from the interactive MFA sign-in
# that created it within 1 hour, or a sign-in / mailbox access whose user agent is in
# @list:suspicious_user_agents").
# Two indicators, both `sql:` (a session join, and a list matched inside the text):
# - session_moved: a signins row or UAL record carrying a session id that was created by an
#   interactive sign-in (a sign-in of unknown kind, is_interactive NULL, counts as interactive, as for
#   spray_sources) that satisfied MFA (auth_requirement starting "multifactor", or
#   mfa_result "MFA successfully completed"; error_code 0 or NULL: an unknown result is kept, the
#   MFA condition already implies the sign-in completed), used at a different IP address within one hour after
#   it, from a different NETWORK. Only the later use is the hit, never the creating sign-in.
#   A different address alone is not enough: a phone moving between Wi-Fi and cellular, a rotating
#   IPv6 privacy address or a carrier NAT pool changes the address inside one session all day
#   (Microsoft Entra: a session token is bound to the user, not to the address). The network is
#   judged from ip_intel (MaxMind GeoLite2 ASN / City, the same enrichment SPW-ID-010 uses):
#     - the country differs; or
#     - the ASN differs AND the use comes from a hosting ASN (ip_intel.is_hosting), or the creating
#       sign-in did, or either end is a password-spray source of the tenant (spray_sources: an
#       address with at least 5 sprayed users who outnumber its excusing users (takeovers do not excuse); compromised
#       ISP routers and residential proxies are not hosting ASNs), or the use is a sign-in Entra
#       rated risk medium/high;
#     - an address on either side that is a Microsoft service front end (ip_intel.is_microsoft:
#       Outlook mobile / Exchange egress, Office 365 endpoint ranges) never counts;
#     - when the ASN is missing on either side (no GeoIP data, or a partial record) the networks
#       cannot be compared and the address difference stands, as before, UNLESS both countries are
#       known and differ (then the country test above counts it). That is a deliberate, documented
#       fallback so partial GeoIP never suppresses a session move: the context says
#       `network: unknown`.
#   Missed on purpose: a same-country replay from an ordinary ISP address that never sprayed the
#   tenant, with no risk rating on the use.
# - suspicious_user_agent: a SUCCESSFUL signins row (error_code 0, or NULL when the result is
#   unknown: fail closed), or a UAL UserLoggedIn / MailboxLogin / MailItemsAccessed record (successful
#   by definition), whose user agent contains an entry of @list:suspicious_user_agents (substring,
#   case insensitive: `axios/1.7.7` matches `axios`). A scripted client that FAILS to sign in
#   (BAV2ROPC / python-requests / go-http-client with 50126 or 50053) is internet-wide legacy-auth
#   password spray, not a replayed session, and is not reported here (a candidate for a future
#   spray rule).
# A record that matches both is one hit; the context lists the indicators.
id: SPW-ID-004
title: Adversary-in-the-middle indicators
version: 3
status: stable
severity: high
confidence: medium
mitre: [T1557, T1550.004]
tags: [bec, aitm, sign-in]
requires: []
requires_evidence: []
sql: |
  WITH creators AS (
    SELECT s.record_key, s.session_id, s.event_time AS t, s.ip
    FROM signins s
    WHERE s.session_id IS NOT NULL AND s.session_id <> ''
      AND (s.error_code IS NULL OR s.error_code = 0)
      AND coalesce(s.is_interactive, true)
      AND (lower(coalesce(s.auth_requirement, '')) LIKE 'multifactor%'
           OR lower(coalesce(s.mfa_result, '')) LIKE '%mfa successfully completed%')
  ),
  uses AS (
    SELECT s.record_key, 'signins' AS src, s.event_time AS t, s.user_upn AS actor, s.ip, s.session_id,
           lower(coalesce(s.risk_level_during, '')) IN ('medium', 'high') AS risky
    FROM signins s
    WHERE s.session_id IS NOT NULL AND s.session_id <> ''
    UNION ALL
    SELECT lower(CAST(u.record_id AS VARCHAR)), 'ual_events', u.event_time, u.user_upn, u.client_ip,
           u.session_id, false
    FROM ual_events u
    WHERE u.session_id IS NOT NULL AND u.session_id <> ''
  ),
  net AS (
    SELECT x.record_key, x.src, x.t, x.actor, x.ip, x.risky,
           (ix.asn IS NOT NULL AND ic.asn IS NOT NULL AND ix.asn <> ic.asn) AS asn_changed,
           (ix.country_iso IS NOT NULL AND ic.country_iso IS NOT NULL
            AND ix.country_iso <> ic.country_iso) AS country_changed,
           ((ix.asn IS NULL OR ic.asn IS NULL)
            AND NOT (ix.country_iso IS NOT NULL AND ic.country_iso IS NOT NULL
                     AND ix.country_iso <> ic.country_iso)) AS unknown,
           (coalesce(ix.is_hosting, false) OR coalesce(ic.is_hosting, false)
            OR EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip IN (x.ip, c.ip))) AS infra
    FROM uses x JOIN creators c ON c.session_id = x.session_id
    LEFT JOIN ip_intel ix ON ix.ip = x.ip
    LEFT JOIN ip_intel ic ON ic.ip = c.ip
    WHERE x.record_key <> c.record_key AND x.ip IS NOT NULL AND x.ip <> '' AND c.ip IS NOT NULL
      AND x.ip <> c.ip AND x.t IS NOT NULL AND c.t IS NOT NULL
      AND epoch_ms(x.t) > epoch_ms(c.t) AND epoch_ms(x.t) <= epoch_ms(c.t) + 3600000
      AND NOT coalesce(ix.is_microsoft, false) AND NOT coalesce(ic.is_microsoft, false)
  ),
  moved AS (
    SELECT n.record_key, n.src, n.t, n.actor, n.ip,
           CASE WHEN n.unknown THEN 'session_moved (network: unknown)'
                ELSE 'session_moved' END AS indicator
    FROM net n
    WHERE n.unknown OR n.country_changed OR (n.asn_changed AND (n.infra OR n.risky))
  ),
  agents AS (
    SELECT s.record_key, 'signins' AS src, s.event_time AS t, s.user_upn AS actor, s.ip,
           'suspicious_user_agent' AS indicator
    FROM signins s
    WHERE coalesce(s.error_code, 0) = 0
      AND len(list_filter(@list:suspicious_user_agents,
                          a -> a <> '' AND strpos(lower(coalesce(s.user_agent, '')), lower(a)) > 0)) > 0
    UNION ALL
    SELECT lower(CAST(u.record_id AS VARCHAR)), 'ual_events', u.event_time, u.user_upn, u.client_ip,
           'suspicious_user_agent'
    FROM ual_events u
    WHERE lower(u.operation) IN ('userloggedin', 'mailboxlogin', 'mailitemsaccessed')
      AND len(list_filter(@list:suspicious_user_agents,
                          a -> a <> '' AND strpos(lower(coalesce(u.user_agent, '')), lower(a)) > 0)) > 0
  ),
  found AS (SELECT * FROM moved UNION ALL SELECT * FROM agents)
  SELECT f.record_key,
         CASE WHEN f.src = 'signins' THEN 'signins' ELSE 'ual_events' END AS source_table,
         min(f.t) AS event_time, min(f.actor) AS actor_upn, min(f.ip) AS ip,
         json_object('indicators', string_agg(DISTINCT f.indicator, ', ' ORDER BY f.indicator)) AS context
  FROM found f
  GROUP BY f.record_key, f.src
group_by: [actor_upn]
analyst_guidance: |
  Two tells of a stolen session. A session that an interactive MFA sign-in created and that is
  then used from another address within the hour is a token that left the user's device (a
  reverse proxy replayed it); a scripted user agent (axios, python-requests, curl) on a sign-in
  or mailbox logon is the replay tool itself. Read the two addresses, whether the second one is
  a hosting provider, the risk detections, and what the session did next (mailbox logon, rules).
false_positives:
  - A user whose phone moves from Wi-Fi to cellular inside one hour on a long-lived session, when no
    GeoIP data is loaded (with it, a same-country move between ordinary ISPs is not reported).
  - Legitimate automation or a monitoring tool that uses a scripted client (okhttp, curl) and succeeds.
references:
  - https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
author: Sparrow
