      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: ual_events
        operation: MailboxLogin
        user_upn: alice@contoso.example
        client_ip: 203.0.113.1
    expect_hits: 0
  - name: an address with no ip_intel row
    records:
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.77
        error_code: 0
    expect_hits: 0
  - name: a connector's hosting sign-ins are not an attacker, whatever the day
