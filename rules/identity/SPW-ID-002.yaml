# SPW-ID-002 — sign-in from a hosting-provider ASN. Logic source: coverage.yaml ("Successful
# sign-in (signins with error_code 0, or UAL UserLoggedIn) whose IP has ip_intel.is_hosting
# (rules/lists/hosting_asns.yaml; Microsoft AS8075 is not hosting)"). `is_hosting` is set by the
# profile step from the hosting ASN list, so the rule reads only that flag; Microsoft's ASN is not
# on the list. `sql:` because the hit joins the event to `ip_intel`. `needs_geoip`: without an
# ASN database no address is ever hosting, so the runner reports not_applicable instead of an
# empty result.
# Success side: error_code 0 or NULL. A NULL result is unknown, not a failure, and an unknown result
# from a hosting address is kept rather than silently dropped (a known failure, a non-zero code,
# never counts).
# Tuning: a cloud-hosted SaaS connector is not an attacker. Third-party SaaS products that read a
# tenant on the users' behalf sign in from their own public-cloud backend (an Azure or AWS ASN,
# scripted user agents such as python-httpx or an Azure SDK), for many users, every day. An
# application is treated as a tenant-wide cloud service when, counting its NON-interactive successful
# sign-ins in this tenant, at least 5 distinct users signed in from hosting ASNs on at least 3
# distinct UTC days AND those hosting sign-ins are at least 80% of the application's non-interactive
# successes. That definition is the tenant's `cloud_services` relation, derived once by the profile
# step and shared with SPW-ID-003, and it is ESTABLISHED from a prefix of the history: only the
# non-interactive hosting sign-ins of a day AFTER the one at whose end the profile was first met are
# excused (cold start: a connector's first days still count). An INTERACTIVE sign-in always counts, so
# an attacker in a browser never rides a connector profile; the UAL arm cannot tell interactive from
# non-interactive and never excuses. No application name or id is involved: the profile decides.
# A sign-in from a password-spray source of the tenant (spray_sources) always counts. Missed on
# purpose: an attacker's consent-phished application whose non-interactive refreshes come from a
# cloud ASN for 5 or more users (SPW-APP-001 and SPW-APP-002 cover the consent), after its first days.
id: SPW-ID-002
title: Sign-in from a hosting-provider ASN
version: 2
status: stable
severity: medium
confidence: medium
mitre: [T1078.004, T1090]
tags: [bec, sign-in, hosting]
requires: []
requires_evidence: []
needs_geoip: true
sql: |
  SELECT s.record_key, 'signins' AS source_table, s.event_time, s.user_upn AS actor_upn,
         s.ip AS ip,
         json_object('asn', i.asn, 'asn_org', i.asn_org, 'hosting_provider', i.hosting_provider) AS context
  FROM signins s JOIN ip_intel i ON i.ip = s.ip
  WHERE (s.error_code IS NULL OR s.error_code = 0) AND coalesce(i.is_hosting, false)
    -- A tenant-wide cloud service's NON-interactive sign-ins of a day after the service was
    -- established are not an attacker; an interactive sign-in (or one of unknown kind) always counts,
    -- and so does one from a password-spray source.
    AND (coalesce(s.is_interactive, true)
         OR NOT EXISTS (SELECT 1 FROM cloud_services c
                        WHERE c.app_id = lower(coalesce(s.app_id, ''))
                          AND epoch_ms(s.event_time) // 86400000 > c.established_day)
         OR EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = s.ip))
  UNION ALL
  SELECT lower(CAST(u.record_id AS VARCHAR)), 'ual_events', u.event_time, u.user_upn, u.client_ip,
         json_object('asn', i.asn, 'asn_org', i.asn_org, 'hosting_provider', i.hosting_provider)
  FROM ual_events u JOIN ip_intel i ON i.ip = u.client_ip
  WHERE lower(u.operation) = 'userloggedin' AND coalesce(i.is_hosting, false)
group_by: [actor_upn]
analyst_guidance: |
  Employees sign in from homes, offices and mobile networks; a sign-in from a data-centre or
  VPS provider is what an adversary-in-the-middle proxy or a token-replay script looks like.
  Compare the address with the user's usual ones, check whether the sign-in satisfied MFA, and
  look for a risk detection or a mailbox logon from the same address.
false_positives:
  - A user on a commercial VPN or a cloud-hosted desktop (VPN egress is often a hosting ASN).
  - A remote worker on a corporate proxy hosted at a cloud provider.
  - A tenant-wide cloud service signing in from its own backend is excluded when 5 or more users use it from hosting ASNs on 3 or more days (80% of its sign-ins).
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-sign-ins-error-codes
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
author: Sparrow
tests:
  - name: successful sign-in from a hosting address
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.1
        error_code: 0
    expect_hits: 1
  - name: UserLoggedIn from a hosting address
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: ual_events
        operation: UserLoggedIn
        user_upn: alice@contoso.example
        client_ip: 203.0.113.1
    expect_hits: 1
  - name: a Microsoft address is not hosting
    records:
      - table: ip_intel
        ip: 203.0.113.9
        asn: 8075
        asn_org: Microsoft Corporation
        is_hosting: false
        is_microsoft: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.9
        error_code: 0
      - table: ual_events
        operation: UserLoggedIn
        user_upn: alice@contoso.example
        client_ip: 203.0.113.9
    expect_hits: 0
  - name: a residential address
    records:
      - table: ip_intel
        ip: 198.51.100.5
        asn: 7922
        is_hosting: false
      - table: signins
        user_upn: alice@contoso.example
        ip: 198.51.100.5
        error_code: 0
    expect_hits: 0
  - name: a known failure from a hosting address is not a successful sign-in
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.1
        error_code: 50126
    expect_hits: 0
  - name: an unknown result from a hosting address is kept, not silently dropped
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.1
    expect_hits: 1
  - name: another operation from a hosting address is not a sign-in
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: ual_events
        operation: MailboxLogin
        user_upn: alice@contoso.example
        client_ip: 203.0.113.1
    expect_hits: 0
  - name: an address with no ip_intel row
    records:
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.77
        error_code: 0
    expect_hits: 0
  - name: a connector's non-interactive hosting sign-ins after it was established are not an attacker
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: cloud_services
        tenant_key: test
        app_id: c0c0c0c0-0000-4000-8000-0000000000c1
        hosting_users: 6
        hosting_days: 3
        signins: 18
        hosting_signins: 18
        established_day: 0
      - table: signins
        user_upn: u0@contoso.example
        ip: 203.0.113.1
        app_id: c0c0c0c0-0000-4000-8000-0000000000c1
        is_interactive: false
        error_code: 0
        event_time: "2026-02-05T09:00:00Z"
