# SPW-ID-002 — sign-in from a hosting-provider ASN. Logic source: coverage.yaml ("Successful
# sign-in (signins with error_code 0, or UAL UserLoggedIn) whose IP has ip_intel.is_hosting
# (rules/lists/hosting_asns.yaml; Microsoft AS8075 is not hosting)"). `is_hosting` is set by the
# profile step from the hosting ASN list, so the rule reads only that flag; Microsoft's ASN is not
# on the list. `sql:` because the hit joins the event to `ip_intel`. `needs_geoip`: without an
# ASN database no address is ever hosting, so the runner reports not_applicable instead of an
# empty result.
# Success side: error_code 0 or NULL. A NULL result is unknown, not a failure, and an unknown result
# from a hosting address is kept rather than silently dropped (a known failure, a non-zero code,
# never counts).
# Tuning: a cloud-hosted SaaS connector is not an attacker. Third-party SaaS products that read a
# tenant on the users' behalf sign users in from their own public-cloud backend (an Azure or AWS ASN,
# scripted user agents), for many users, every day, and the portal's interactive export records those
# rows as interactive. A tenant-wide cloud service is an (application, hosting ASN) pair: at least 5
# distinct users with known successes to the application from that ASN on at least 3 distinct UTC days,
# at least 80% of the application's known successes (interactive and non-interactive both count). That
# is the tenant's `cloud_services` relation, derived once by the profile step from the WHOLE case (no
# prefix: a capture is a window, so a connector in use since before it starts must not count on the
# days that precede its "establishment") and shared with SPW-ID-003. Every sign-in to that application
# from that same ASN is excused, in BOTH arms: a signins row by its app_id, and a UAL UserLoggedIn by
# ual_events.app_id (AuditData AppId, else ApplicationId; compared lower-case). The same application
# from another hosting ASN, any other application, a UAL logon with no application id and a sign-in or
# logon from a password-spray source of the tenant (spray_sources) always count.
# An (application, ASN) is NOT a service when (a) sprayed users (a credential failure from a spray
# source of the tenant) are at least 20% of its users or at least 3 of them are sprayed, or (b) at least
# 3 distinct users have an interactive credential failure to the application from that ASN. So accounts
# taken from a spray, or typed wrongly on a VPS first, are not excused, while one stale or sprayed
# account does not bring a real connector's findings back.
# Residuals, documented, exactly what is excused: up to 2 sprayed users while they are under 20% of the
# pair's users (so only when the pair has 11 or more users); used from the connector's own (application,
# ASN) from an address that is not itself a spray source, they are reported by NEITHER ID-002, ID-003 NOR
# SPW-ID-005 (ID-005 reads only successes from a spray-source address). Up to 2 distinct users with
# credential failures from the ASN to the application. 5 or more PHISHED (not sprayed) accounts used from
# one VPS on the same THIRD-PARTY application for 3 or more days with no failures look exactly like a
# connector and are excused. A failure row with no user name never counts toward the 3 failing users. Residual,
# documented: an attacker using the same application from the same cloud ASN as an established connector
# is excused, and a connector's first days (cold start) are excused too (SPW-ID-005 and the consent
# rules, SPW-APP-001/002, remain). The one application list involved is rules/lists/
# microsoft_first_party_apps.yaml (Microsoft first-party ids from public Microsoft Learn pages): an
# (application, ASN) pair of a first-party application (OfficeHome, Outlook, Exchange Online, SharePoint,
# Teams, OneDrive, the Azure and Graph tools) is NEVER a service, whatever its users or days, because
# accounts phished and used from a VPS sign in to Office and Outlook while a real connector is a
# third-party application, which stays excused even when it is onboarded mid-capture. Residual,
# documented: an attacker on a third-party application (it needs a consent, SPW-APP-001/002 report it)
# or on a first-party application missing from the list.
id: SPW-ID-002
title: Sign-in from a hosting-provider ASN
version: 3
status: stable
severity: medium
confidence: medium
mitre: [T1078.004, T1090]
tags: [bec, sign-in, hosting]
requires: []
requires_evidence: []
needs_geoip: true
sql: |
  SELECT s.record_key, 'signins' AS source_table, s.event_time, s.user_upn AS actor_upn,
         s.ip AS ip,
         json_object('asn', i.asn, 'asn_org', i.asn_org, 'hosting_provider', i.hosting_provider) AS context
  FROM signins s JOIN ip_intel i ON i.ip = s.ip
  WHERE (s.error_code IS NULL OR s.error_code = 0) AND coalesce(i.is_hosting, false)
    -- A tenant-wide cloud service's sign-ins (interactive or not: the portal export records a
    -- connector's backend as interactive) to that application from that same hosting ASN are not an
    -- attacker; another ASN, another application and a password-spray source always count.
    AND NOT EXISTS (SELECT 1 FROM cloud_services c
                    WHERE c.app_id = lower(coalesce(s.app_id, '')) AND c.asn = i.asn
                      AND NOT EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = s.ip))
  UNION ALL
  SELECT lower(CAST(u.record_id AS VARCHAR)), 'ual_events', u.event_time, u.user_upn, u.client_ip,
         json_object('asn', i.asn, 'asn_org', i.asn_org, 'hosting_provider', i.hosting_provider)
  FROM ual_events u JOIN ip_intel i ON i.ip = u.client_ip
  WHERE lower(u.operation) = 'userloggedin' AND coalesce(i.is_hosting, false)
    -- The same exclusion as the sign-in arm: a connector's backend may write UserLoggedIn records too.
    -- The UAL carries the application in app_id; a logon with none is never excused.
    AND NOT EXISTS (SELECT 1 FROM cloud_services c
                    WHERE c.app_id = lower(coalesce(u.app_id, '')) AND c.asn = i.asn
                      AND NOT EXISTS (SELECT 1 FROM spray_sources p WHERE p.ip = u.client_ip))
group_by: [actor_upn]
analyst_guidance: |
  Employees sign in from homes, offices and mobile networks; a sign-in from a data-centre or
  VPS provider is what an adversary-in-the-middle proxy or a token-replay script looks like.
  Compare the address with the user's usual ones, check whether the sign-in satisfied MFA, and
  look for a risk detection or a mailbox logon from the same address.
false_positives:
  - A user on a commercial VPN or a cloud-hosted desktop (VPN egress is often a hosting ASN).
  - A remote worker on a corporate proxy hosted at a cloud provider.
  - A tenant-wide cloud service signing in from its own backend is excluded (sign-ins and UserLoggedIn logons alike) when 5 or more users use the application from one hosting ASN on 3 or more days (80% of its sign-ins), unless sprayed users are 20% of them (or 3), or 3 users failed their credentials from that ASN.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-sign-ins-error-codes
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
author: Sparrow
tests:
  - name: successful sign-in from a hosting address
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.1
        error_code: 0
    expect_hits: 1
  - name: UserLoggedIn from a hosting address
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: ual_events
        operation: UserLoggedIn
        user_upn: alice@contoso.example
        client_ip: 203.0.113.1
    expect_hits: 1
  - name: a Microsoft address is not hosting
    records:
      - table: ip_intel
        ip: 203.0.113.9
        asn: 8075
        asn_org: Microsoft Corporation
        is_hosting: false
        is_microsoft: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.9
        error_code: 0
      - table: ual_events
        operation: UserLoggedIn
        user_upn: alice@contoso.example
        client_ip: 203.0.113.9
    expect_hits: 0
  - name: a residential address
    records:
      - table: ip_intel
        ip: 198.51.100.5
        asn: 7922
        is_hosting: false
      - table: signins
        user_upn: alice@contoso.example
        ip: 198.51.100.5
        error_code: 0
    expect_hits: 0
  - name: a known failure from a hosting address is not a successful sign-in
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.1
        error_code: 50126
    expect_hits: 0
  - name: an unknown result from a hosting address is kept, not silently dropped
    records:
      - table: ip_intel
        ip: 203.0.113.1
        asn: 14061
        is_hosting: true
      - table: signins
        user_upn: alice@contoso.example
        ip: 203.0.113.1
    expect_hits: 1
  - name: another operation from a hosting address is not a sign-in
