# SPW-ID-007 — persistence within the hour after the user's first sign-in from a new network.
# Logic source: coverage.yaml. The residual it closes: a stolen session replayed from an ordinary ISP in
# the user's own country, with no risk rating, is seen by neither SPW-ID-004 (same country, not hosting,
# not a spray source) nor SPW-ID-003 (no far location) nor SPW-ID-010 (no risk, not hosting).
# A new network alone means little (real data: 43% of users get a new same-country, non-hosting ASN after
# their first three days), so the rule correlates it with what an attacker does next.
#
# The new-network sign-in (context, not the trigger):
#   - a SUCCESSFUL sign-in: an Entra sign-in with error_code 0 or NULL, or a UAL UserLoggedIn whose
#     result is not Failed (Hawk 3 has no Entra log);
#   - the user's FIRST successful sign-in from that ASN in the case. History is the user's successful
#     sign-ins only: a failed attempt from a network does not make it known, and another address of a
#     known ASN is not new. Because it is the first, the ASN was not used on an earlier day;
#   - capture-window safety: the user must have successful sign-ins on at least 3 distinct UTC days
#     BEFORE that sign-in's day, so a user's first three active days in the case (or a short capture) are
#     never judged, and the country of the sign-in must be one the user signed in from on an earlier UTC
#     day (a new country is SPW-ID-003's and SPW-MAIL-006's case);
#   - ip_intel knows its ASN and country (no GeoIP: not judged), it is not a hosting ASN (SPW-ID-010's
#     case) and not a Microsoft address;
#   - it is not rated medium/high risk. The UAL carries no risk, so an Entra sign-in and its UAL
#     UserLoggedIn twin at the same instant are one sign-in: a rating on either excludes both.
# The trigger is a persistence action by the same user (actor) at most 60 minutes after that sign-in:
#   - UAL / Hawk 3 admin audit log: New-InboxRule, Set-InboxRule, UpdateInboxRules (UAL), Add-MailboxPermission,
#     and Set-Mailbox setting a non-empty ForwardingSmtpAddress or ForwardingAddress;
#   - directory audit / UAL (the UAL spelling ends in "."): Consent to application, Add app role assignment
#     grant to user, Add app role assignment to service principal, User registered security info, Add member
#     to role, and Update user of the strong-authentication details (SPW-ID-001's definition).
# Real data (architect's probe, 2026-10-04): 2 users within 1 hour, both incident users; 24 hours widens it
# to 6 users, 4 of them incident users, so the window is 1 hour.
# One row per persistence record; when two new networks precede it, the context names the later one.
# Residuals, documented: a replay whose first sign-in from the network is rated risky (the risk rules see
# it), a persistence action more than an hour after the new network, and a network whose ASN or country is
# unknown to GeoIP.
id: SPW-ID-007
title: Persistence within 60 minutes of the user's first sign-in from a new same-country network
version: 1
status: stable
severity: high
confidence: medium
mitre: [T1078.004, T1098, T1564.008]
tags: [bec, session-replay, persistence, correlation]
requires: []
requires_evidence: []
needs_geoip: true
sql: |
  WITH logons AS (
    SELECT lower(s.user_upn) AS upn, s.event_time AS t, s.ip,
           lower(coalesce(s.risk_level_during, '')) IN ('medium', 'high') AS risky
    FROM signins s
    WHERE (s.error_code IS NULL OR s.error_code = 0)
      AND s.user_upn IS NOT NULL AND s.ip IS NOT NULL AND s.ip <> ''
    UNION ALL
    SELECT lower(u.user_upn), u.event_time, u.client_ip, false
    FROM ual_events u
    WHERE lower(u.operation) = 'userloggedin'
      AND lower(coalesce(u.result_status, '')) <> 'failed'
      AND u.user_upn IS NOT NULL AND u.client_ip IS NOT NULL AND u.client_ip <> ''
  ),
  net AS (
    SELECT l.upn, epoch_ms(l.t) AS ms, epoch_ms(l.t) // 86400000 AS d, l.ip, l.risky,
           i.asn, i.country_iso AS cc, coalesce(i.is_hosting, false) AS hosting,
           coalesce(i.is_microsoft, false) AS microsoft
    FROM logons l LEFT JOIN ip_intel i ON i.ip = l.ip
  ),
  days AS (SELECT DISTINCT upn, d FROM net),
  first_net AS (SELECT upn, asn, min(ms) AS ms FROM net WHERE asn IS NOT NULL GROUP BY upn, asn),
  first_cc AS (
    SELECT upn, cc, min(d) AS d FROM net WHERE cc IS NOT NULL AND cc <> '' GROUP BY upn, cc
  ),
  -- The first successful sign-in of a user from each ASN (an Entra row and its UAL twin are one).
  new_net AS (
    SELECT n.upn, n.ms, n.d, n.asn, n.cc, min(n.ip) AS ip
    FROM net n JOIN first_net f ON f.upn = n.upn AND f.asn = n.asn AND f.ms = n.ms
    WHERE n.cc IS NOT NULL AND n.cc <> ''
    GROUP BY n.upn, n.ms, n.d, n.asn, n.cc
    HAVING NOT bool_or(n.risky) AND NOT bool_or(n.hosting) AND NOT bool_or(n.microsoft)
  ),
  fresh AS (
    SELECT x.* FROM new_net x
    WHERE (SELECT count(*) FROM days y WHERE y.upn = x.upn AND y.d < x.d) >= 3
      AND EXISTS (SELECT 1 FROM first_cc c WHERE c.upn = x.upn AND c.cc = x.cc AND c.d < x.d)
  ),
  persist AS (
    SELECT lower(CAST(u.record_id AS VARCHAR)) AS record_key, 'ual' AS src, u.event_time AS t,
           u.user_upn AS actor, u.client_ip AS ip, u.operation AS action
    FROM ual_events u
    WHERE rtrim(lower(u.operation), '.') IN (
            'new-inboxrule', 'set-inboxrule', 'updateinboxrules', 'add-mailboxpermission',
            'consent to application', 'add app role assignment grant to user',
            'add app role assignment to service principal', 'user registered security info',
            'add member to role')
       OR (lower(u.operation) = 'update user.'
           AND CAST(u.audit_data AS VARCHAR) LIKE '%StrongAuthentication%')
       OR (lower(u.operation) = 'set-mailbox'
           AND EXISTS (SELECT 1 FROM unnest(map_entries(u.parameters)) AS x(e)
                       WHERE lower(x.e.key) IN ('forwardingsmtpaddress', 'forwardingaddress')
                         AND trim(coalesce(x.e.value, '')) <> ''))
    UNION ALL
    SELECT a.record_key, 'admin', a.run_time, a.caller, a.client_ip, a.cmdlet
    FROM admin_audit_events a
    WHERE lower(a.cmdlet) IN ('new-inboxrule', 'set-inboxrule', 'add-mailboxpermission')
       OR (lower(a.cmdlet) = 'set-mailbox'
           AND EXISTS (SELECT 1 FROM unnest(map_entries(a.parameters)) AS x(e)
                       WHERE lower(x.e.key) IN ('forwardingsmtpaddress', 'forwardingaddress')
                         AND trim(coalesce(x.e.value, '')) <> ''))
    UNION ALL
    SELECT d.record_key, 'directory', d.event_time, d.initiated_by_upn, d.initiated_by_ip, d.activity
    FROM directory_audits d
    WHERE lower(d.activity) IN (
            'consent to application', 'add app role assignment grant to user',
            'add app role assignment to service principal', 'user registered security info',
            'add member to role')
       OR (lower(d.activity) = 'update user'
           AND (CAST(d.targets AS VARCHAR) LIKE '%StrongAuthentication%'
                OR CAST(d.modified_properties AS VARCHAR) LIKE '%StrongAuthentication%'))
  )
  SELECT p.record_key,
         CASE WHEN p.src = 'ual' THEN 'ual_events'
              WHEN p.src = 'admin' THEN 'admin_audit_events'
              ELSE 'directory_audits' END AS source_table,
         p.t AS event_time, p.actor AS actor_upn, p.ip,
         json_object('action', p.action, 'network_ip', n.ip, 'network_asn', n.asn,
                     'network_country', n.cc,
                     'network_signin_utc', strftime(make_timestamp(n.ms * 1000), '%Y-%m-%dT%H:%M:%SZ'),
                     'minutes_after', (epoch_ms(p.t) - n.ms) // 60000) AS context
  FROM persist p
  JOIN fresh n ON n.upn = lower(p.actor)
    AND n.ms <= epoch_ms(p.t) AND n.ms >= epoch_ms(p.t) - 3600000
  QUALIFY row_number() OVER (PARTITION BY p.src, p.record_key ORDER BY n.ms DESC, n.ip) = 1
group_by: [actor_upn]
analyst_guidance: |
  The user signed in for the first time from a network (ASN) they had not used, in their usual country,
  from an ordinary ISP with no risk rating, and within the hour the same account created an inbox rule,
  granted mailbox access, set forwarding, consented to an application, registered a security method or
  changed a role. That is how a replayed session cookie or token looks when it comes from a residential
  proxy or a compromised router near the victim. Ask the user whether they were on that network (a new
  phone carrier, a hotel, a relative's Wi-Fi) and whether they made the change; read the change itself
  (rule conditions and actions, the grantee, the application's scopes, the new authenticator's device).
false_positives:
  - A user who changes phone carrier or works from a new place and, within the hour, legitimately edits a rule or registers a new phone.
  - An admin who signs in from a new network (a new office line, a hotspot) and makes routine role changes.
references:
  - https://learn.microsoft.com/en-us/purview/audit-log-activities
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: Sparrow
