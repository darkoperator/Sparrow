# Real collector layouts, structure only, from docs/superpowers/research/2026-09-24-hawk-capture-survey.md
# and 2026-09-25-invictus-sample-survey.md (+ 2026-09-26-phase5-invictus-event-layouts.md §0.3
# corrections). No values. `columns`: the CSV header as seen (any listed variant matches);
# `columns_required`: the columns every surveyed variant shares, used where the header varies
# with the first record (Hawk's flattened `Simple_*`, survey §2b/§2e);
# `json_keys`: keys every JSON record has; `encodings` per PowerShell edition; `dates`: the
# date forms seen per column (`inferred: true` marks a form inferred, not observed); `file_pattern`
# distinguishes shapes that share one registry artifact id. Artifacts with no real sample are
# absent: they are source-derived and the report lists them as "source-derived, not checked".
#
# CSV headers are compared after the reader's normalization (BOM stripped, whitespace runs
# collapsed, duplicate names suffixed `_2`), so the portal quirks (`Application ID ` trailing
# space, `Autonomous system  number` double space, a second `Incoming token type`) appear below
# in normalized form.
version: 1
artifacts:
  # ------------------------------------------------------------------ Invictus sample §4
  - artifact: inv.ual.window
    collector: invictus
    source: invictus sample §4.1 (PS7)
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    dates: {CreationDate: [culture_mdy]}
    embedded_json: {AuditData: [CreationTime, Id, Operation, OrganizationId, RecordType, UserId, Workload]}
  - artifact: inv.ual.merged
    collector: invictus
    source: invictus sample §4.1
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    dates: {CreationDate: [culture_mdy]}
  - artifact: inv.signins
    collector: invictus
    source: invictus sample §4.2 (Graph beta REST)
    formats: [json]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    json_keys: [id, createdDateTime, userPrincipalName, ipAddress, isInteractive, signInEventTypes, riskEventTypes_v2, sessionId]
    dates: {createdDateTime: [iso_z]}
  - artifact: inv.entra_audit
    collector: invictus
    source: invictus sample §4.3 (Graph directoryAudits)
    formats: [json]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    json_keys: [id, category, correlationId, result, resultReason, activityDisplayName, activityDateTime, loggedByService, operationType, initiatedBy, targetResources, additionalDetails]
    dates: {activityDateTime: [iso_z]}
  - artifact: inv.message_trace
    collector: invictus
    source: invictus sample §4.4
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [MessageTraceId, MessageId, Received, SenderAddress, RecipientAddress, FromIP, ToIP, Subject, Status, Size]
    dates: {Received: [culture_mdy]}
  - artifact: inv.mia.sessions
    collector: invictus
    source: invictus sample §4.5
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [TimeStamp, User, Action, SessionId, ClientIP, MailAccessType, IsThrottled, OperationCount]
    # PS7 renders the AuditData CreationTime in the host culture, 5.1 keeps the ISO text. The
    # survey's only sample is PS7, so the `iso_nozone` form is an inference (event-layouts §0.3),
    # not an observation.
    dates: {TimeStamp: [culture_mdy, iso_nozone]}
    inferred: true
  - artifact: inv.mia.message_ids
    collector: invictus
    source: invictus sample §4.5
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [Timestamp, User, IPaddress, SessionID, MailAccessType, FolderPath, InternetMessageId, SizeInBytes]
    # The survey's only sample is PS7; `iso_nozone` for PS 5.1 is an inference (event-layouts §0.3).
    dates: {Timestamp: [culture_mdy, iso_nozone]}
    inferred: true
  - artifact: inv.audit_status
    collector: invictus
    source: invictus sample §4.6
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [UserPrincipalName, DisplayName, RecipientTypeDetails, AuditEnabled, AuditBypassEnabled, DefaultAuditSet, OwnerAuditActions, OwnerAuditActionsCount, DelegateAuditActions, DelegateAuditActionsCount, AdminAuditActions, AdminAuditActionsCount, EffectiveAuditState]
  - artifact: inv.mailbox_permissions
    collector: invictus
    source: invictus sample §4.7
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [UserPrincipalName, DisplayName, RecipientTypeDetails, FullAccessUsers, FullAccessPermissions, SendAsUsers, SendAsPermissions, SendOnBehalfUsers, CalendarUsers, CalendarPermissions, InboxUsers, InboxPermissions, FullAccessCount, SendAsCount, SendOnBehalfCount, CalendarPermissionCount, InboxPermissionCount]
  - artifact: inv.licenses.security_defaults
    collector: invictus
    source: invictus sample §4.8
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [SecurityDefaultsEnabled, HasPremiumLicense, RecommendedState, AlignedWithRecommendations, CheckDate]
    dates: {CheckDate: [local_log]}

  # ------------------------------------------------------------------ Hawk survey §2b–§2e, §3
  - artifact: hawk.tenant.raw_ual
    collector: hawk
    source: hawk survey §2c (Hawk 4 Raw Search-UnifiedAuditLog)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, Identity, IsValid, ObjectState]
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    dates: {CreationDate: [culture_mdy, iso_nozone, iso_z, msdate]}
  - artifact: hawk.user.raw_auth
    collector: hawk
    source: hawk survey §2e
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, Identity, IsValid, ObjectState]
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    json_keys: [RecordType, CreationDate, UserIds, Operations, AuditData]
    dates: {CreationDate: [culture_mdy, iso_nozone, iso_z, msdate]}
  # `hawk.user.raw_ual` spans several real file shapes (ExchangeItem_Logs raw UAL,
  # Exchange_UAL_Audit expanded, User_Changes admin-audit), so it is not listed here: the
  # registry artifact id is not one file. Its raw-UAL shape is covered by hawk.user.raw_auth.
  - artifact: hawk.user.converted_auth
    collector: hawk
    source: hawk survey §2e (expanded STS AuditData + geo)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [CreationTime, UserId, Workload, ClientIP, CountryName, KnownMicrosoftIP, Operation, OrganizationId, RecordType, ResultStatus, UserType, Version]
    dates: {CreationTime: [short_g]}
  - artifact: hawk.user.message_trace
    collector: hawk
    source: hawk survey §2e (Get-MessageTrace)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Organization, MessageId, Received, SenderAddress, RecipientAddress, Subject, Status, ToIP, FromIP, Size, MessageTraceId, StartDate, EndDate, Index]
    dates: {Received: [culture_mdy, iso_nozone, iso_z, msdate]}
  - artifact: hawk.user.inbox_rules
    collector: hawk
    source: hawk survey §2e (Get-InboxRule, 74 cols in C / 92 in B)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Description, Enabled, Identity, InError, ErrorType, Name, Priority, RuleIdentity, SupportedByTask, Legacy, BodyContainsWords, StopProcessingRules, MailboxOwnerId, IsValid, ObjectState]
  - artifact: hawk.tenant.consent_grants
    collector: hawk
    source: hawk survey §2d
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [PermissionType, ClientObjectId, ClientDisplayName, ResourceObjectId, ResourceDisplayName, Permission, ConsentType, PrincipalObjectId, PrincipalDisplayName]
  - artifact: hawk.tenant.entra_users
    collector: hawk
    source: hawk survey §2c (EntraIDUsers)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [UserPrincipalName, DisplayName, Id, AccountEnabled, CreatedDateTime]
    dates: {CreatedDateTime: [culture_mdy, iso_z, msdate]}

  # ------------------------------------------------------------------ Portal exports (hawk survey §3)
  - artifact: portal.ual
    collector: portal
    source: hawk survey §3 (Purview / audit search export)
    formats: [csv, xlsx]
    encodings: {any: [utf-8, utf-8-bom]}
    line_ends: crlf
    columns:
      - [RecordId, CreationDate, RecordType, Operation, UserId, AuditData, AssociatedAdminUnits, AssociatedAdminUnitsNames]
    dates: {CreationDate: [culture_mdy, iso_z]}
    embedded_json: {AuditData: [CreationTime, Id, Operation, OrganizationId, RecordType, UserId, Workload]}
  - artifact: portal.entra_signins
    collector: portal
    source: hawk survey §3 (Entra interactive sign-in export)
    formats: [csv, xlsx]
    encodings: {any: [utf-8-bom]}
    line_ends: lf
    columns_required: ["Date (UTC)", "Request ID", "User agent", "Correlation ID", "User ID", "User", "Username", "IP address", "Location", "Status", "Application ID", "Resource ID", "Autonomous system number", "Incoming token type"]
    dates: {"Date (UTC)": [iso_z]}
  - artifact: portal.message_trace
    collector: portal
    source: hawk survey §3 (Exchange message trace summary)
    formats: [csv]
    encodings: {any: [utf-16le, utf-8]}
    columns:
      - [origin_timestamp_utc, sender_address, recipient_status, message_subject, total_bytes, message_id, network_message_id, original_client_ip, directionality, connector_id, delivery_priority]
    dates: {origin_timestamp_utc: [iso_z]}

  # ------------------------------------------------------------------ Hawk survey §2b–§2e (continued)
  # Every artifact above extra shapes that share a registry id are separate entries selected by
  # `file_pattern`; the check accepts a header that any entry for the artifact accepts.
  - artifact: hawk.tenant.admin_audit
    collector: hawk
    source: hawk survey §2b (Hawk 3 New/Set/Remove_InboxRules, RBAC_Changes; 17-col Search-AdminAuditLog)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [ObjectModified, CmdletName, CmdletParameters, ModifiedProperties, Caller, ExternalAccess, Succeeded, Error, RunDate, OriginatingServer, ClientIP, SessionId, AppId, ClientAppId, Identity, IsValid, ObjectState]
    dates: {RunDate: [culture_mdy, iso_z, iso_offset, iso_nozone, local_log, msdate]}
  - artifact: hawk.tenant.azuread_users
    collector: hawk
    source: hawk survey §2b (Hawk 3 AzureADUsers)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [UserPrincipalname, ObjectID, UserType, DateCreated, UserStateChangedOn, DirSyncEnabled]
    dates: {DateCreated: [culture_mdy], UserStateChangedOn: [iso_z]}
  - artifact: hawk.tenant.azuread_admins
    collector: hawk
    source: hawk survey §2b (Hawk 3 AzureADAdministrators)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [AdminGroupName, Members]
  - artifact: hawk.tenant.ediscovery_role_assignments
    collector: hawk
    source: hawk survey §2b (Hawk 3 EDiscoveryRoleAssignments / Impersonation_Rights, 37-col role assignment)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # One OMFT call (Get-ManagementRoleAssignment): one record is a bare object, several an array.
    # The generated world holds 3+ assignments, so the generated shape must be the array; `bare`
    # stays allowed for a real capture with one record.
    json_shape: [bare, array]
    json_shape_expected: [array]
    columns_required: [DataObject, User, App, AssignmentMethod, Identity, EffectiveUserName, AssignmentChain, RoleAssigneeType, RoleAssignee, Role, RoleAssignmentDelegationType, RecipientReadScope, ConfigReadScope, RecipientWriteScope, ConfigWriteScope, Enabled, RoleAssigneeName, Id, IsValid, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ObjectState]
  - artifact: hawk.tenant.impersonation
    collector: hawk
    source: hawk survey §2b (Hawk 3 Impersonation_Rights/Roles)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Identity, Role, RoleAssignee, AssignmentMethod, Enabled, Name, Id, IsValid, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ObjectState]
  - artifact: hawk.tenant.impersonation
    collector: hawk
    source: hawk survey §2b (Impersonation_Roles, 22-col role entry)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "Impersonation_Roles"
    columns_required: [Name, Role, Type, Parameters, PSSnapinName, Identity, Id, IsValid, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ObjectState]
  - artifact: hawk.tenant.forwarding_recipients
    collector: hawk
    source: hawk survey §2b (Hawk 3 Forwarding_Recipients)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [UserModified, TargetSMTPAddress]
  - artifact: hawk.tenant.entra_app_audit
    collector: hawk
    source: hawk survey §2b/§2c (Azure_/Entra_ID_Application_Audit)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Id, Operation, ResultStatus, Workload, ClientIP, UserID, ActorUPN, targetName, env_time, correlationId]
  - artifact: hawk.tenant.simple_ual
    collector: hawk
    source: hawk survey §2b (Hawk 3 Simple_* admin-audit flattening)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "Simple_(New_InboxRule|Set_InboxRule|Remove_InboxRule|Mailbox_Permissions|Forwarding_Changes|RBAC_Changes)"
    columns_required: [Caller, Cmdlet, FullCommand, ObjectModified]
    dates: {"RunDate(UTC)": [iso_z, culture_mdy, msdate]}
  - artifact: hawk.tenant.simple_ual
    collector: hawk
    source: hawk survey §2c (flattened AuditData; the CSV header is the first record's keys,
      so only the columns every variant shares are required)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "Simple_eDiscoveryLogs"
    columns_required: [CreationTime, Workload, RecordType, Operation, UserId, Id, OrganizationId, UserType, UserKey, Version, CreationDate]
  - artifact: hawk.tenant.raw_ual
    collector: hawk
    source: hawk survey §2b (Hawk 3 eDiscoveryLogs.csv, 8 cols)
    formats: [csv]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "eDiscoveryLogs"
    columns_required: [CreationTime, Id, Operation, Workload, UserId, Case, CaseID, Cmdlet]
    dates: {CreationTime: [iso_nozone, culture_mdy]}
  - artifact: hawk.tenant.raw_ual
    collector: hawk
    source: hawk survey §2b (Hawk 3 admin-audit raw UAL shape)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "(Admin_Inbox_Rules|Mailbox_Permission_Change|Forwarding_Changes|RBAC_Changes|Domain_Changes_Audit)"
    columns_required: [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, Identity, IsValid, ObjectState]
  - artifact: hawk.tenant.entra_admins
    collector: hawk
    source: hawk survey §2c (EntraIDAdministrators)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [AdminGroupName, Members, MemberType, ObjectId]
  - artifact: hawk.tenant.entra_audit
    collector: hawk
    source: hawk survey §2c (EntraIDAuditLogs)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [ActivityDateTime, ActivityDisplayName, AdditionalDetails, Category, CorrelationId, Id, InitiatedBy, LoggedByService, OperationType, Result, ResultReason, TargetResources, AdditionalProperties]
    dates: {ActivityDateTime: [culture_mdy, iso_z, msdate]}
  - artifact: hawk.tenant.risky_users
    collector: hawk
    source: hawk survey §2c (RiskyUsers)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [History, Id, IsDeleted, IsProcessing, RiskDetail, RiskLastUpdatedDateTime, RiskLevel, RiskState, UserDisplayName, UserPrincipalName, AdditionalProperties]
    dates: {RiskLastUpdatedDateTime: [culture_mdy, iso_z, msdate]}
  - artifact: hawk.tenant.risk_detections
    collector: hawk
    source: hawk survey §2c (Risk_Detections)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Activity, ActivityDateTime, CorrelationId, DetectedDateTime, DetectionTimingType, IPAddress, Id, LastUpdatedDateTime, Location, RequestId, RiskDetail, RiskEventType, RiskLevel, RiskState, Source, TokenIssuerType, UserDisplayName, UserId, UserPrincipalName, AdditionalProperties]
    dates: {ActivityDateTime: [culture_mdy, iso_z, msdate], DetectedDateTime: [culture_mdy, iso_z, msdate], LastUpdatedDateTime: [culture_mdy, iso_z, msdate]}
  - artifact: hawk.tenant.app_credentials
    collector: hawk
    source: hawk survey §2d (Application/SPNCertsAndSecrets)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [AppName, AppObjectID, KeyID, StartDate, EndDate, KeyType, CredType]
    dates: {StartDate: [culture_mdy, iso_z, msdate], EndDate: [culture_mdy, iso_z, msdate]}
  - artifact: hawk.tenant.exo_admins
    collector: hawk
    source: hawk survey §2d (ExchangeOnlineAdministrators)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [ExchangeAdminGroup, Members, RecipientType]
  - artifact: hawk.tenant.remote_domain
    collector: hawk
    source: hawk survey §2d (Get-RemoteDomain, version-dependent column count)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # One OMFT call: a single domain is a bare object (survey §2d), several an array.
    # The generated world holds the Default plus a partner domain, so the generated shape must
    # be the array; `bare` stays allowed for a real capture with one domain.
    json_shape: [bare, array]
    json_shape_expected: [array]
    columns_required: [DomainName, IsInternal, Name, Identity, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ObjectState]
  - artifact: hawk.tenant.transport_config
    collector: hawk
    source: hawk survey §2d (Get-TransportConfig, version-dependent column count)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Name, Identity, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ObjectState]
  - artifact: hawk.tenant.transport_rules
    collector: hawk
    source: hawk survey §2d (Get-TransportRule, version-dependent column count)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Priority, DlpPolicy, Description, RuleVersion, Conditions, Exceptions, Actions, State, Mode, Name, Identity, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ObjectState]
  - artifact: hawk.tenant.user_forwarding_report
    collector: hawk
    source: hawk survey §2d (User_ForwardingReport)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # One OMFT call per user with `-Append`: one user is a bare object, several concatenate
    # complete documents (research hawk-layouts §2).
    json_shape: [bare, concatenated]
    columns_required: [DisplayName, UserPrincipalName, PrimarySmtpAddress, ForwardingSmtpAddress, ForwardingAddress, DeliverToMailboxAndForward, WhenChangedUTC]
    dates: {WhenChangedUTC: [culture_mdy, iso_z, msdate]}
  - artifact: hawk.tenant.all_inbox_rules
    collector: hawk
    source: hawk survey §2b (Hawk 3 Tenant/All_InboxRules, Get-InboxRule)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # A single document (survey §2b: byte-identical to a user's `InboxRules_<u>`): one rule is
    # a bare object, several an array. Never the concatenated per-user `-Append` documents.
    json_shape: [bare, array]
    columns_required: [Description, Enabled, Identity, InError, ErrorType, Name, Priority, RuleIdentity, SupportedByTask, Legacy, StopProcessingRules, MailboxOwnerId, IsValid, ObjectState]
  - artifact: hawk.tenant.all_sweep_rules
    collector: hawk
    source: hawk survey §2d (Get-SweepRule)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Name, RuleId, Enabled, SourceFolder, DestinationFolder, Sender, KeepLatest, KeepForDays, SystemCategory, MailboxOwnerId, Identity, IsValid, ObjectState]
  - artifact: hawk.user.forwarding
    collector: hawk
    source: hawk survey §2e (ForwardingReport_<u>)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [DisplayName, UserPrincipalName, PrimarySmtpAddress, ForwardingSmtpAddress, ForwardingAddress, DeliverToMailboxAndForward, WhenChangedUTC]
    dates: {WhenChangedUTC: [culture_mdy, iso_z, msdate]}
  - artifact: hawk.user.mailbox_audit_legacy
    collector: hawk
    source: hawk survey §2e (Search-MailboxAuditLog, 55 cols)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Operation, OperationResult, LogonType, ExternalAccess, FolderPathName, FolderName, ClientInfoString, ClientIPAddress, ClientIP, ClientMachineName, ClientProcessName, ClientVersion, InternalLogonType, MailboxOwnerUPN, MailboxOwnerSid, CrossMailboxOperation, LogonUserDisplayName, LogonUserSid, SourceItems, SourceFolders, ItemId, ItemSubject, ItemAttachments, ItemInternetMessageId, DirtyProperties, OriginatingServer, SessionId, OperationProperties, AppId, ClientAppId, MailboxGuid, MailboxResolvedOwnerName, LastAccessed, Identity, IsValid, ObjectState]
    dates: {LastAccessed: [culture_mdy, msdate, iso_offset]}
  - artifact: hawk.user.mobile_devices
    collector: hawk
    source: hawk survey §2e (Get-MobileDevice, 39 cols)
    formats: [csv, json]
