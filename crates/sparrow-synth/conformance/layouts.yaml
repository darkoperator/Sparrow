# Real collector layouts, structure only, from docs/superpowers/research/2026-09-24-hawk-capture-survey.md
# and 2026-09-25-invictus-sample-survey.md (+ 2026-09-26-phase5-invictus-event-layouts.md §0.3
# corrections). No values. `columns`: the CSV header as seen (any listed variant matches);
# `columns_required`: the columns every surveyed variant shares, used where the header varies
# with the first record (Hawk's flattened `Simple_*`, survey §2b/§2e);
# `json_keys`: keys every JSON record has; `encodings` per PowerShell edition; `dates`: the
# date forms seen per column (`inferred: true` marks a form inferred, not observed); `file_pattern`
# distinguishes shapes that share one registry artifact id. Artifacts with no real sample are
# absent: they are source-derived and the report lists them as "source-derived, not checked".
#
# CSV headers are compared after the reader's normalization (BOM stripped, whitespace runs
# collapsed, duplicate names suffixed `_2`), so the portal quirks (`Application ID ` trailing
# space, `Autonomous system  number` double space, a second `Incoming token type`) appear below
# in normalized form.
version: 1
artifacts:
  # ------------------------------------------------------------------ Invictus sample §4
  - artifact: inv.ual.window
    collector: invictus
    source: invictus sample §4.1 (PS7)
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    dates:
      CreationDate:
        any: [culture_mdy]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
    embedded_json: {AuditData: [CreationTime, Id, Operation, OrganizationId, RecordType, UserId, Workload]}
  - artifact: inv.ual.merged
    collector: invictus
    source: invictus sample §4.1
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    dates:
      CreationDate:
        any: [culture_mdy]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
  - artifact: inv.signins
    collector: invictus
    source: invictus sample §4.2 (Graph beta REST)
    formats: [json]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    json_keys: [id, createdDateTime, userPrincipalName, ipAddress, isInteractive, signInEventTypes, riskEventTypes_v2, sessionId]
    dates: {createdDateTime: [iso_z]}
  - artifact: inv.entra_audit
    collector: invictus
    source: invictus sample §4.3 (Graph directoryAudits)
    formats: [json]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    json_keys: [id, category, correlationId, result, resultReason, activityDisplayName, activityDateTime, loggedByService, operationType, initiatedBy, targetResources, additionalDetails]
    dates: {activityDateTime: [iso_z]}
  - artifact: inv.message_trace
    collector: invictus
    source: invictus sample §4.4
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [MessageTraceId, MessageId, Received, SenderAddress, RecipientAddress, FromIP, ToIP, Subject, Status, Size]
    dates:
      Received:
        any: [culture_mdy]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
  - artifact: inv.mia.sessions
    collector: invictus
    source: invictus sample §4.5
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [TimeStamp, User, Action, SessionId, ClientIP, MailAccessType, IsThrottled, OperationCount]
    # PS7 renders the AuditData CreationTime in the host culture, 5.1 keeps the ISO text. The
    # survey's only sample is PS7, so the `iso_nozone` form is an inference (event-layouts §0.3),
    # not an observation.
    dates:
      TimeStamp:
        any: [culture_mdy, iso_nozone]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
    inferred: true
  - artifact: inv.mia.message_ids
    collector: invictus
    source: invictus sample §4.5
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [Timestamp, User, IPaddress, SessionID, MailAccessType, FolderPath, InternetMessageId, SizeInBytes]
    # The survey's only sample is PS7; `iso_nozone` for PS 5.1 is an inference (event-layouts §0.3).
    dates:
      Timestamp:
        any: [culture_mdy, iso_nozone]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
    inferred: true
  - artifact: inv.audit_status
    collector: invictus
    source: invictus sample §4.6
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [UserPrincipalName, DisplayName, RecipientTypeDetails, AuditEnabled, AuditBypassEnabled, DefaultAuditSet, OwnerAuditActions, OwnerAuditActionsCount, DelegateAuditActions, DelegateAuditActionsCount, AdminAuditActions, AdminAuditActionsCount, EffectiveAuditState]
  - artifact: inv.mailbox_permissions
    collector: invictus
    source: invictus sample §4.7
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [UserPrincipalName, DisplayName, RecipientTypeDetails, FullAccessUsers, FullAccessPermissions, SendAsUsers, SendAsPermissions, SendOnBehalfUsers, CalendarUsers, CalendarPermissions, InboxUsers, InboxPermissions, FullAccessCount, SendAsCount, SendOnBehalfCount, CalendarPermissionCount, InboxPermissionCount]
  - artifact: inv.licenses.security_defaults
    collector: invictus
    source: invictus sample §4.8
    formats: [csv]
    encodings: {"7": [utf-8], "5.1": [utf-8-bom]}
    columns:
      - [SecurityDefaultsEnabled, HasPremiumLicense, RecommendedState, AlignedWithRecommendations, CheckDate]
    dates: {CheckDate: [local_log]}

  # ------------------------------------------------------------------ Hawk survey §2b–§2e, §3
  - artifact: hawk.tenant.raw_ual
    collector: hawk
    source: hawk survey §2c (Hawk 4 Raw Search-UnifiedAuditLog)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, Identity, IsValid, ObjectState]
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    # Both `iso_nozone` and `iso_z` are observed: the `CreationDate` DateTime's Kind follows
    # the Exchange Online module build (capture B zone-less, C/D tenant `Z`; survey:122,
    # research hawk layouts :199, :446). The generator picks one per tree.
    dates:
      CreationDate:
        any: [culture_mdy, iso_nozone, iso_z, msdate]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
  - artifact: hawk.user.raw_auth
    collector: hawk
    source: hawk survey §2e
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns:
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, Identity, IsValid, ObjectState]
      - [RecordType, CreationDate, UserIds, Operations, AuditData, ResultIndex, ResultCount, AuditSearchRequestMetadata, Identity, IsValid, ObjectState]
    json_keys: [RecordType, CreationDate, UserIds, Operations, AuditData]
    # `CreationDate` is the `[DateTime]` `Search-UnifiedAuditLog` returns, exported unchanged
    # (`Out-MultipleFileType.ps1:196-202`). Its .NET Kind follows the Exchange Online module
    # build, so the survey saw BOTH renderings: zone-less ISO on PS7 in capture B and `…Z` on
    # the tenant files of C/D (survey 2026-09-24-hawk-capture-survey.md:122; research
    # 2026-09-26-phase5-hawk-layouts.md:174, :199, :446 — D was an earlier 4.0 build). The
    # generator picks one per tree, so both forms are recorded. CSV (`Export-Csv`) is always the
    # host culture, hence the per-culture keys.
    dates:
      CreationDate:
        any: [culture_mdy, iso_nozone, iso_z, msdate]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
  # `hawk.user.raw_ual` spans several real file shapes (ExchangeItem_Logs raw UAL,
  # Exchange_UAL_Audit expanded, User_Changes admin-audit), so it is not listed here: the
  # registry artifact id is not one file. Its raw-UAL shape is covered by hawk.user.raw_auth.
  - artifact: hawk.user.converted_auth
    collector: hawk
    source: hawk survey §2e (expanded STS AuditData + geo)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # The header is the union of the expanded records' own AuditData properties, so it varies
    # with the record types and ExtendedProperties entries of the run: it is not one fixed
    # list, and `columns_required` stays the right check. Every StsLogon record carries
    # `KeepMeSignedIn`, `UserAuthenticationMethod` and `ZipCode` (the geo lookup only adds
    # CountryName, RegionCode, RegionName, City, KnownMicrosoftIP), which is why the real
    # captures hold them.
    columns_required: [CreationTime, UserId, Workload, ClientIP, CountryName, KnownMicrosoftIP, Operation, OrganizationId, RecordType, ResultStatus, UserType, Version]
    dates: {CreationTime: [short_g]}
  - artifact: hawk.user.message_trace
    collector: hawk
    source: hawk survey §2e (Get-MessageTrace)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [Organization, MessageId, Received, SenderAddress, RecipientAddress, Subject, Status, ToIP, FromIP, Size, MessageTraceId, StartDate, EndDate, Index]
    dates:
      Received:
        any: [culture_mdy, iso_nozone, iso_z, msdate]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
  - artifact: hawk.user.inbox_rules
    collector: hawk
    # Get-InboxRule: 74 columns in the Hawk 3 capture, 92 in the Hawk 4 one (which adds the
    # category, header, date and `MyNameIn*` columns). The generated row is the full 92-column
    # set: the identity block, every condition with its `ExceptIf*` twin, every action, then
    # the object's own columns.
    # https://learn.microsoft.com/powershell/module/exchange/get-inboxrule
    source: hawk survey §2e (Get-InboxRule, 74 cols in C / 92 in B)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns:
      - [Description, Enabled, Identity, InError, ErrorType, Name, Priority, RuleIdentity, SupportedByTask, Legacy,
         AnyCategory, ExceptIfAnyCategory, AssignedCategories, ExceptIfAssignedCategories, BodyContainsWords,
         ExceptIfBodyContainsWords, BulkCategory, ExceptIfBulkCategory, FlaggedForAction, ExceptIfFlaggedForAction, From,
         ExceptIfFrom, FromAddressContainsWords, ExceptIfFromAddressContainsWords, HasAttachment, ExceptIfHasAttachment,
         HasClassification, ExceptIfHasClassification, HeaderContainsWords, ExceptIfHeaderContainsWords, IsExternal,
         ExceptIfIsExternal, IsMentioned, ExceptIfIsMentioned, MarkImportance, MessageTypeMatches,
         ExceptIfMessageTypeMatches, MyNameInCcBox, ExceptIfMyNameInCcBox, MyNameInToBox, ExceptIfMyNameInToBox,
         MyNameInToOrCcBox, ExceptIfMyNameInToOrCcBox, MyNameNotInToBox, ExceptIfMyNameNotInToBox, ReceivedAfterDate,
         ExceptIfReceivedAfterDate, ReceivedBeforeDate, ExceptIfReceivedBeforeDate, RecipientAddressContainsWords,
         ExceptIfRecipientAddressContainsWords, SentOnlyToMe, ExceptIfSentOnlyToMe, SentTo, ExceptIfSentTo,
         SubjectContainsWords, ExceptIfSubjectContainsWords, SubjectOrBodyContainsWords,
         ExceptIfSubjectOrBodyContainsWords, WithImportance, ExceptIfWithImportance, WithSensitivity,
         ExceptIfWithSensitivity, WithinSizeRangeMaximum, ExceptIfWithinSizeRangeMaximum, WithinSizeRangeMinimum,
         ExceptIfWithinSizeRangeMinimum, ApplyCategory, ApplySystemCategory, AutoReplyWithTemplate, ClearCategories,
         ClearFlag, CompleteFlag, CopyToFolder, DeleteMessage, DeleteSystemCategory, DisplayAlert, FlagMessage,
         ForwardAsAttachmentTo, ForwardTo, MarkAsRead, MoveToFolder, PermanentDelete, PinMessage, PlaySound, RedirectTo,
         SendTextMessageNotificationTo, SoftDeleteMessage, StopProcessingRules, MailboxOwnerId, IsValid, ObjectState]
  - artifact: hawk.tenant.consent_grants
    collector: hawk
    source: hawk survey §2d
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [PermissionType, ClientObjectId, ClientDisplayName, ResourceObjectId, ResourceDisplayName, Permission, ConsentType, PrincipalObjectId, PrincipalDisplayName]
  - artifact: hawk.tenant.entra_users
    collector: hawk
    source: hawk survey §2c (EntraIDUsers)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [UserPrincipalName, DisplayName, Id, AccountEnabled, CreatedDateTime]
    dates:
      CreatedDateTime:
        any: [culture_mdy, iso_z, msdate]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]

  # ------------------------------------------------------------------ Portal exports (hawk survey §3)
  - artifact: portal.ual
    collector: portal
    source: hawk survey §3 (Purview / audit search export)
    formats: [csv, xlsx]
    encodings: {any: [utf-8, utf-8-bom]}
    line_ends: crlf
    columns:
      - [RecordId, CreationDate, RecordType, Operation, UserId, AuditData, AssociatedAdminUnits, AssociatedAdminUnitsNames]
    dates:
      # A fixed ISO-8601 service string (`iso7`, writers/portal.rs:177), so the host culture
      # does not apply: no per-culture keys. `culture_mdy` is capture A's rendering.
      CreationDate:
        any: [culture_mdy, iso_z]
    embedded_json: {AuditData: [CreationTime, Id, Operation, OrganizationId, RecordType, UserId, Workload]}
  - artifact: portal.entra_signins
    collector: portal
    source: hawk survey §3 (Entra interactive sign-in export)
    formats: [csv, xlsx]
    encodings: {any: [utf-8-bom]}
    line_ends: lf
    # The 57 columns of the 4.x export (the 3.x one has 49), after the header cleanup the
    # reader applies to a CSV header and a workbook header alike: trimmed, inner spaces
    # collapsed, a repeated column suffixed `_2`. The files themselves carry the portal's own
    # spellings -- `Application ID ` and `Resource ID ` with a trailing space,
    # `Autonomous system  number` with two, `Incoming token type` twice (survey §3).
    columns:
      - ["Date (UTC)", "Request ID", "User agent", "Correlation ID", "User ID", "User", "Username", "User type", "Cross tenant access type", "Incoming token type", "Authentication Protocol", "Unique token identifier", "Original transfer method", "Client credential type", "Token Protection - Sign In Session", "Token Protection - Sign In Session StatusCode", "Application", "Application ID", "App owner tenant ID", "Resource", "Resource ID", "Resource tenant ID", "Resource owner tenant ID", "Home tenant ID", "Home tenant name", "IP address", "Location", "Status", "Sign-in error code", "Failure reason", "Client app", "Device ID", "Browser", "Operating System", "Compliant", "Managed", "Join Type", "Multifactor authentication result", "Multifactor authentication auth method", "Multifactor authentication auth detail", "Authentication requirement", "Sign-in identifier", "Session ID", "IP address (seen by resource)", "Through Global Secure Access", "Global Secure Access IP address", "Autonomous system number", "Flagged for review", "Token issuer type", "Incoming token type_2", "Token issuer name", "Latency", "Conditional Access", "Managed Identity type", "Associated Resource Id", "Federated Token Id", "Federated Token Issuer"]
    dates: {"Date (UTC)": [iso_z]}
  - artifact: portal.message_trace
    collector: portal
    source: hawk survey §3 (Exchange message trace summary)
    formats: [csv]
    # The summary download is a Windows-1252 file: A/B are UTF-16LE without a byte-order mark
    # and D is neither valid UTF-8, UTF-16 nor cp1252 (an Excel re-save), so the reader's
    # Windows-1252 fallback is what an analyst's ingest sees of the real captures.
    encodings: {any: [utf-16le, utf-8, windows-1252]}
    columns:
      - [origin_timestamp_utc, sender_address, recipient_status, message_subject, total_bytes, message_id, network_message_id, original_client_ip, directionality, connector_id, delivery_priority]
    dates: {origin_timestamp_utc: [iso_z]}

  # ------------------------------------------------------------------ Hawk survey §2b–§2e (continued)
  # Every artifact above extra shapes that share a registry id are separate entries selected by
  # `file_pattern`; the check accepts a header that any entry for the artifact accepts.
  - artifact: hawk.tenant.admin_audit
    collector: hawk
    source: >-
      hawk survey §2b/§2e (Hawk 3.1 Tenant/New_InboxRules, Set_InboxRules, Remove_InboxRules and
      <user>/User_Changes_<user>; 17-col Search-AdminAuditLog)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # The exact Search-AdminAuditLog column order (survey:59, :111): `CmdletParameters` and
    # `ModifiedProperties` are arrays and `Identity` / `ObjectState` nested objects in JSON,
    # strings in CSV.
    columns:
      - [ObjectModified, CmdletName, CmdletParameters, ModifiedProperties, Caller, ExternalAccess, Succeeded, Error, RunDate, OriginatingServer, ClientIP, SessionId, AppId, ClientAppId, Identity, IsValid, ObjectState]
    # `RunDate` is a host-local `[DateTime]`: `Export-Csv` renders it in the host culture and
    # `ConvertTo-Json` by .NET kind - `/Date(ms)/` on 5.1 (survey:12, :122), an offset on 7.
    dates:
      RunDate:
        any: [culture_mdy, iso_z, iso_offset, iso_nozone, local_log, msdate]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
  - artifact: hawk.tenant.azuread_users
    collector: hawk
    source: hawk survey §2b (Hawk 3 AzureADUsers)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [UserPrincipalname, ObjectID, UserType, DateCreated, UserStateChangedOn, DirSyncEnabled]
    dates:
      DateCreated:
        any: [culture_mdy]
        en-gb: [culture_dmy]
        de-de: [culture_dmy_de]
      UserStateChangedOn:
        any: [iso_z]
  - artifact: hawk.tenant.azuread_admins
    collector: hawk
    source: hawk survey §2b (Hawk 3 AzureADAdministrators)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [AdminGroupName, Members]
  - artifact: hawk.tenant.ediscovery_roles
    collector: hawk
    source: hawk survey §2b (EDiscoveryRoles, Get-ManagementRoleEntry)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # One direct `Get-ManagementRoleEntry` per role, de-duplicated by role, and Hawk 4's
    # `CustomEDiscoveryRoles` (the same artifact id), so two shapes share this id. The
    # role-entry schema: 22 columns in the captures, 23 with `DirectoryObjectVersion`
    # (survey §2b's bracketed column), which is the variant the generator writes; the second
    # variant is the 37-column role-assignment schema of
    # `hawk.tenant.ediscovery_role_assignments`.
    # https://learn.microsoft.com/powershell/module/exchange/get-managementrole
    columns:
      - [Name, Role, Type, Parameters, PSSnapinName, Identity, Id, IsValid, ExchangeVersion, DirectoryObjectVersion,
         DistinguishedName, ObjectCategory, ObjectClass, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC,
         ExchangeObjectId, OrganizationalUnitRoot, OrganizationId, Guid, OriginatingServer, ObjectState]
      - [DataObject, User, App, AssignmentMethod, Identity, EffectiveUserName, AssignmentChain, RoleAssigneeType,
         RoleAssignee, Role, RoleAssignmentDelegationType, CustomRecipientWriteScope, CustomConfigWriteScope,
         CustomResourceScope, RecipientReadScope, ConfigReadScope, RecipientWriteScope, ConfigWriteScope, Enabled,
         RoleAssigneeName, Id, IsValid, ExchangeVersion, Name, DistinguishedName, ObjectCategory, ObjectClass,
         WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ExchangeObjectId, OrganizationalUnitRoot,
         OrganizationId, Guid, OriginatingServer, ObjectState]
  - artifact: hawk.tenant.ediscovery_role_assignments
    collector: hawk
    source: hawk survey §2b (Hawk 3 EDiscoveryRoleAssignments / Impersonation_Rights, 37-col role assignment)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # One OMFT call (Get-ManagementRoleAssignment): one record is a bare object, several an array.
    # The generated world holds 3+ assignments, so the generated shape must be the array; `bare`
    # stays allowed for a real capture with one record.
    json_shape: [bare, array]
    json_shape_expected: [array]
    # The 37 columns survey §2b records, in its order.
    # https://learn.microsoft.com/powershell/module/exchange/get-managementroleassignment
    columns:
      - [DataObject, User, App, AssignmentMethod, Identity, EffectiveUserName, AssignmentChain, RoleAssigneeType,
         RoleAssignee, Role, RoleAssignmentDelegationType, CustomRecipientWriteScope, CustomConfigWriteScope,
         CustomResourceScope, RecipientReadScope, ConfigReadScope, RecipientWriteScope, ConfigWriteScope, Enabled,
         RoleAssigneeName, Id, IsValid, ExchangeVersion, Name, DistinguishedName, ObjectCategory, ObjectClass,
         WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ExchangeObjectId, OrganizationalUnitRoot,
         OrganizationId, Guid, OriginatingServer, ObjectState]
  - artifact: hawk.tenant.impersonation
    collector: hawk
    source: hawk survey §2b (Hawk 3 Impersonation_Rights/Roles)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # `Impersonation_Rights` is the 37-column role-assignment schema of survey §2b, as
    # `EDiscoveryRoleAssignments`; Role is always `ApplicationImpersonation`.
    # https://learn.microsoft.com/powershell/module/exchange/get-managementroleassignment
    columns:
      - [DataObject, User, App, AssignmentMethod, Identity, EffectiveUserName, AssignmentChain, RoleAssigneeType,
         RoleAssignee, Role, RoleAssignmentDelegationType, CustomRecipientWriteScope, CustomConfigWriteScope,
         CustomResourceScope, RecipientReadScope, ConfigReadScope, RecipientWriteScope, ConfigWriteScope, Enabled,
         RoleAssigneeName, Id, IsValid, ExchangeVersion, Name, DistinguishedName, ObjectCategory, ObjectClass,
         WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC, ExchangeObjectId, OrganizationalUnitRoot,
         OrganizationId, Guid, OriginatingServer, ObjectState]
  - artifact: hawk.tenant.impersonation
    collector: hawk
    source: hawk survey §2b (Impersonation_Roles, 22-col role entry)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "Impersonation_Roles"
    # The role-entry schema, as `EDiscoveryRoles`: 22 columns in the captures, 23 with
    # `DirectoryObjectVersion` (survey §2b's bracketed column), which is the variant the
    # generator writes.
    # https://learn.microsoft.com/powershell/module/exchange/get-managementrole
    columns:
      - [Name, Role, Type, Parameters, PSSnapinName, Identity, Id, IsValid, ExchangeVersion, DirectoryObjectVersion,
         DistinguishedName, ObjectCategory, ObjectClass, WhenChanged, WhenCreated, WhenChangedUTC, WhenCreatedUTC,
         ExchangeObjectId, OrganizationalUnitRoot, OrganizationId, Guid, OriginatingServer, ObjectState]
  - artifact: hawk.tenant.forwarding_recipients
    collector: hawk
    source: hawk survey §2b (Hawk 3 Forwarding_Recipients)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    columns_required: [UserModified, TargetSMTPAddress]
  - artifact: hawk.tenant.entra_app_audit
    collector: hawk
    source: hawk survey §2b/§2c (Azure_/Entra_ID_Application_Audit)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    # The 10 columns `Get-HawkTenantEntraIDAppAuditLog` projects
    # (Collectors/hawk.4.0.0/functions/Tenant/Get-HawkTenantEntraIDAppAuditLog.ps1:100-107).
    # The source asks for `UserID`, but `Select-Object` keeps the AuditData property's own
    # case, so every real capture holds `UserId` (survey §2a).
    columns:
      - [Id, Operation, ResultStatus, Workload, ClientIP, UserId, ActorUPN, targetName, env_time, correlationId]
  - artifact: hawk.tenant.simple_ual
    collector: hawk
    source: hawk survey §2b (Hawk 3 Simple_* admin-audit flattening)
    formats: [csv, json]
    encodings: {"5.1": [utf-8-bom, utf-16le-bom], "7": [utf-8]}
    file_pattern: "Simple_(New_InboxRule|Set_InboxRule|Remove_InboxRule|Mailbox_Permissions|Forwarding_Changes|RBAC_Changes)"
    columns_required: [Caller, Cmdlet, FullCommand, ObjectModified]
    dates:
      "RunDate(UTC)":
        any: [iso_z, culture_mdy, msdate]
