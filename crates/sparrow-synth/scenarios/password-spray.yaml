name: password-spray
description: >-
  Internet-wide password spray against an E5 tenant with 60 users (ten per home city, so an
  office NAT is one shared address of ten users): a distributed low-and-slow spray from residential ISP
  addresses in several countries, one source that later signs a sprayed user in, and the benign
  look-alikes (an office egress where users mistype, one phone retrying a stale password).
tenant:
  name: Northwind Example
  domains: [northwind.example, northwind-sales.test]
  users: 60
  admins: 1
  licence_profile: m365_e5
  audit_profile: search_audited
  host_utc_offset_minutes: 0
  # Hawk collects Entra sign-ins only for the users under investigation (a handful) and only for its recent
  # range: three here. A spray needs sign-ins of 5 distinct users, so SPW-ID-005 and SPW-ID-006 are
  # not_applicable on Hawk 4 and say why; the tenant-wide exports (Portal, Invictus) carry all 60.
  hawk_users: [2, 3, 20]
window:
  start: 2026-08-01T00:00:00Z
  days: 40
  collected_at: 2026-09-10T14:15:00Z
baseline:
  signins_per_user_day: 4.0
  ual_per_user_day: 6.0
  messages_per_user_day: 2.0
  work_hours: [8, 18]
  weekend_factor: 0.1
storylines:
  # A new SaaS connector onboards (its first three days are hosting sign-ins the profile cannot know yet).
  - {kind: cloud_connector_onboarding, id: s-onboard, actor: 12, at: {day: 24, hour: 6}}
  # The connector's app used from a VPS on another hosting ASN than the connector's, after it was established.
  - {kind: connector_app_other_asn, id: s-otherasn, actor: 13, at: {day: 29, hour: 14}}
  # Spray variants that each need their own path: phished credentials first; a foreign source that
  # succeeds; a proxy that sprays 18 accounts and takes five of them on later days; sprayed accounts on a cloud VPS.
  - {kind: spray_after_phish, id: s-afterphish, actor: 24, at: {day: 32, hour: 4}}
  - {kind: spray_success_foreign, id: s-succforeign, actor: 25, at: {day: 33, hour: 5}}
  - {kind: spray_proxy_takeover, id: s-takeover, actor: 26, at: {day: 31, hour: 4}}
  - {kind: spray_vps_login, id: s-vps, actor: 27, at: {day: 32, hour: 8}}
  # Attacker paths that each need their own tuned detection path (residential infrastructure).
  - {kind: replay_other_country, id: s-replay, actor: 20, at: {day: 29, hour: 10}}
  # Late in the window: Hawk's sign-in log reaches back 14 days only, and the foreign-network test needs
  # the user's sign-in history from at least three days before the burst.
  - {kind: mia_burst_residential, id: s-miares, actor: 21, at: {day: 37, hour: 11}}
  - {kind: send_residential, id: s-sendres, actor: 22, at: {day: 31, hour: 12}}
  - {kind: spray_replay, id: s-sprayreplay, actor: 23, at: {day: 32, hour: 3}}
  # Inside the last 14 days so Hawk's sign-in range collects them.
  - {kind: distributed_spray, id: s-spray, actor: 2, at: {day: 30, hour: 2}}
  - {kind: spray_success, id: s-spraywin, actor: 3, at: {day: 33, hour: 3}}
lookalikes:
  - {kind: office_nat_mistypes, id: l-nat, actor: 1, at: {day: 33, hour: 9}}
  - {kind: phone_stale_password, id: l-phone, actor: 4, at: {day: 34, hour: 7}}
  - {kind: password_spray, id: l-below, actor: 8, at: {day: 35, hour: 3}}
  # The established connector (the same app, the days after its onboarding), a secure web gateway with CA
  # blocks and token-refresh errors, and a conference network with three mistyped passwords.
  # Departed and disabled accounts failing behind an office NAT that ten users sign in from.
  - {kind: office_stale_accounts, id: l-stale, actor: 11, at: {day: 35, hour: 9}}
  - {kind: cloud_connector, id: l-connector, actor: 12, at: {day: 27, hour: 6}}
  - {kind: gateway_egress, id: l-gateway, actor: 28, at: {day: 33, hour: 9}}
  - {kind: conference_network, id: l-conf, actor: 29, at: {day: 34, hour: 8}}
