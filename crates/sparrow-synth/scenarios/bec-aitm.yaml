name: bec-aitm
description: Adversary-in-the-middle sign-in and the full BEC kill chain on an E5 tenant.
tenant:
  name: Contoso Example
  domains: [contoso.example, contoso-finance.test]
  users: 12
  admins: 1
  licence_profile: m365_e5
  audit_profile: search_audited
  host_utc_offset_minutes: 120
  hawk_users: [1, 2]
window:
  start: 2026-08-01T00:00:00Z
  days: 40
  collected_at: 2026-09-10T14:15:00Z
baseline:
  signins_per_user_day: 4.0
  ual_per_user_day: 12.0
  messages_per_user_day: 6.0
  work_hours: [8, 18]
  weekend_factor: 0.1
storylines:
  - {kind: aitm_signin, id: s-aitm, actor: 1, at: {day: 20, hour: 9, minute: 12}}
  - {kind: confirmed_compromised, id: s-comp, actor: 1, at: {after: s-aitm, minutes: 600}}
  - {kind: mfa_method_added, id: s-mfa, actor: 1, at: {after: s-aitm, minutes: 12}}
  - {kind: oauth_consent, id: s-consent, actor: 1, at: {after: s-aitm, minutes: 45}}
  - {kind: app_credential_added, id: s-cred, actor: 1, at: {after: s-aitm, minutes: 90}}
lookalikes:
  - {kind: risk_dismissed, id: l-dismiss, actor: 2, at: {day: 5, hour: 11}}
  - {kind: mfa_new_hire, id: l-newhire, actor: 4, at: {day: 3, hour: 9, minute: 30}}
  - {kind: low_risk_consent, id: l-poll, actor: 5, at: {day: 8, hour: 14}}
  - {kind: app_signin_existing_consent, id: l-notes, actor: 6, at: {day: 9, hour: 10}}
  - {kind: cert_rotation, id: l-cert, at: {day: 11, hour: 16}}
  - {kind: microsoft_asn_signin, id: l-cloudpc, actor: 7, at: {day: 12, hour: 8, minute: 30}}
  - {kind: plausible_travel, id: l-travel, actor: 8, at: {day: 14, hour: 7}}
  - {kind: same_ip_token_use, id: l-sameip, actor: 9, at: {day: 15, hour: 9}}
