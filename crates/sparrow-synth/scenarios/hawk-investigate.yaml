name: hawk-investigate
description: >-
  Office 365 E5 tenant (Audit Premium and MDO P2, but no Entra ID P1/P2) exercising every
  condition Start-HawkUserInvestigation checks.
tenant:
  name: Tailspin Example
  domains: [tailspin.example, tailspin-toys.test]
  users: 10
  admins: 2
  licence_profile: o365_e5
  audit_profile: default
  host_utc_offset_minutes: 0
window:
  start: 2026-07-20T00:00:00Z
  days: 45
  collected_at: 2026-09-04T11:00:00Z
baseline:
  signins_per_user_day: 4.0
  ual_per_user_day: 12.0
  messages_per_user_day: 6.0
  work_hours: [8, 18]
  weekend_factor: 0.1
storylines:
  - {kind: domain_federation, id: s-domain, at: {day: 30, hour: 22, minute: 10}}
  - {kind: new_mobile_device, id: s-mobile, actor: 2, at: {day: 12, hour: 18}}
  - {kind: oauth_consent, id: s-consent, actor: 3, at: {day: 25, hour: 10}}
lookalikes:
  - {kind: domain_property_update, id: l-domain, at: {day: 33, hour: 9}}
  - {kind: old_mobile_device, id: l-oldmobile, actor: 4, at: {day: 5, hour: 8}}
  - {kind: low_risk_consent, id: l-poll, actor: 5, at: {day: 7, hour: 13}}
  - {kind: app_signin_existing_consent, id: l-notes, actor: 6, at: {day: 9, hour: 15}}
