name: business-basic
description: Microsoft 365 Business Basic tenant with organization mailbox auditing disabled.
tenant:
  name: Adatum Example
  domains: [adatum.example, adatum-corp.test]
  users: 6
  admins: 1
  licence_profile: business_basic
  audit_profile: org_audit_disabled
  host_utc_offset_minutes: 60
window:
  start: 2026-08-20T00:00:00Z
  days: 14
  collected_at: 2026-09-04T10:00:00Z
baseline:
  signins_per_user_day: 4.0
  ual_per_user_day: 12.0
  messages_per_user_day: 6.0
  work_hours: [8, 18]
  weekend_factor: 0.1
storylines:
  - {kind: aitm_signin, id: s-aitm, actor: 1, at: {day: 7, hour: 9, minute: 30}}
  - {kind: inbox_rule_finance, id: s-rule, actor: 1, at: {after: s-aitm, minutes: 25}}
  - {kind: forwarding_mailbox, id: s-fwd, actor: 1, at: {after: s-aitm, minutes: 50}}
  # Not logged: organization mailbox auditing is off.
  - {kind: mia_burst, id: s-mia, actor: 1, at: {after: s-aitm, minutes: 60}}
  # The audit profile itself: organization auditing is off (a true SPW-CFG-001 state hit).
  - {kind: org_audit_disabled_state, id: s-orgaudit, actor: 1, at: {day: 1, hour: 8}}
lookalikes:
  - {kind: vendor_filing_rule, id: l-vendor, actor: 3, at: {day: 4, hour: 10}}
  - {kind: plausible_travel, id: l-travel, actor: 4, at: {day: 5, hour: 7}}
