name: audit-tamper
description: Microsoft 365 E5 tenant where an attacker tampers with audit configuration mid-window.
tenant:
  name: Wingtip Example
  domains: [wingtip.example, wingtip-toys.test]
  users: 8
  admins: 1
  licence_profile: m365_e5
  audit_profile: default
  host_utc_offset_minutes: 540
window:
  start: 2026-08-15T00:00:00Z
  days: 20
  collected_at: 2026-09-05T08:00:00Z
baseline:
  signins_per_user_day: 4.0
  ual_per_user_day: 12.0
  messages_per_user_day: 6.0
  work_hours: [8, 18]
  weekend_factor: 0.1
storylines:
  - {kind: aitm_signin, id: s-aitm, actor: 1, at: {day: 10, hour: 8}}
  - {kind: inbox_rule_finance, id: s-rule, actor: 1, at: {after: s-aitm, minutes: 20}}
  - {kind: audit_tamper, id: s-tamper, actor: 1, at: {after: s-aitm, minutes: 60}}
  # Everything below happens after UAL ingestion is off: none of it is logged.
  - {kind: mia_burst, id: s-mia, actor: 1, at: {after: s-tamper, minutes: 30}}
  - {kind: delegate_finance_delete, id: s-deldel, actor: 1, target: 2, at: {after: s-tamper, minutes: 35}}
  - {kind: forwarding_mailbox, id: s-fwd, actor: 1, at: {after: s-tamper, minutes: 40}}
  - {kind: admin_inbox_rule, id: s-admrule, target: 2, at: {after: s-tamper, minutes: 45}}
  - {kind: ediscovery_search, id: s-ediscovery, at: {after: s-tamper, minutes: 50}}
  - {kind: mass_download, id: s-dl, actor: 1, at: {after: s-tamper, minutes: 55}}
  - {kind: anonymous_link, id: s-anon, actor: 1, at: {after: s-tamper, minutes: 60}}
  - {kind: lure_share, id: s-lure, actor: 1, at: {after: s-tamper, minutes: 65}}
lookalikes:
  - {kind: audit_config_benign, id: l-auditok, actor: 2, at: {day: 3, hour: 10}}
