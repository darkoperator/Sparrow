[package]
name = "sparrow-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Sparrow review app (Tauri backend)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Lets an agent drive the window through the Tauri MCP server; registered in debug builds only (main.rs).
tauri-plugin-mcp-bridge = "0.13"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
duckdb.workspace = true
tempfile.workspace = true
sparrow-core = { path = "../sparrow-core" }
sparrow-cli = { path = "../sparrow-cli" }
anyhow.workspace = true
getrandom = "0.3"
hex.workspace = true

[target.'cfg(windows)'.dependencies]
# The file identity that tells a hard link to the open case (cmd/export.rs).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
csv.workspace = true
# The failure-injection hooks of core (a feature of the existing crate; no new dependency).
sparrow-core = { path = "../sparrow-core", features = ["test-fixtures"] }
sparrow-synth = { path = "../sparrow-synth" }
