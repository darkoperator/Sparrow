# Operations Sparrow knows, with a category for the timeline and ATT&CK techniques.
# operation: as UAL / Graph / Exchange write it (matching ignores case and a trailing ".").
# External files (--data DIR) replace entries by (operation, workload) and may add new ones.
version: 1
operations:
