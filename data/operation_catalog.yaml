  - {operation: UserLoggedIn, category: auth, description: Successful sign-in (UAL), mitre: [T1078.004]}
  - {operation: UserLoginFailed, category: auth, description: Failed sign-in (UAL), mitre: [T1110]}
  - {operation: MailboxLogin, workload: Exchange, category: auth, description: Mailbox sign-in, mitre: [T1078.004]}
  - {operation: SignInSucceeded, category: auth, description: Entra sign-in succeeded (Sparrow timeline name), mitre: [T1078.004]}
  - {operation: SignInFailed, category: auth, description: Entra sign-in failed (Sparrow timeline name), mitre: [T1110]}
