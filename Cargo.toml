[workspace]
resolver = "3"
members = ["crates/sparrow-cli", "crates/sparrow-core", "crates/sparrow-synth", "crates/sparrow-app"]
default-members = ["crates/sparrow-cli", "crates/sparrow-core", "crates/sparrow-synth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# The pinned duckdb crate requires rustc 1.85.1 (`cargo +1.85.0 check` fails on it).
rust-version = "1.85.1"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
calamine = { version = "=0.35.0", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
duckdb = { version = "=1.10505.0", features = ["bundled", "json"] }
encoding_rs = "0.8"
hex = "0.4"
ipnet = "2.12"
maxminddb = "0.32"
predicates = "3"
regex = "1"
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9.42"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }
walkdir = "2"
zip = { version = "=7.2.0", default-features = false }

# Dependencies (including the bundled DuckDB C++, built by libduckdb-sys' build script via the
# `cc` crate, which reads the profile's OPT_LEVEL) are optimized even in dev/test builds: the
# whole workspace is DuckDB-heavy, and an unoptimized bundled DuckDB dominates the test suite's
# wall time while adding nothing debuggable. Our own crates stay at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: nothing steps into them, and with DuckDB linked into every test
# binary it is most of target/.
debug = false

# Our own library crates are lightly optimized in dev/test builds: generating, ingesting and
# profiling synthetic trees is the test suite's work, and at opt-level 0 it dominated the wall time
# (measured on the default job: conformance 461 s -> 135 s, portal 58 s -> 18 s, detect_gate
# 144 s -> 45 s). opt-level 2 gave no further run-time gain for +17 s of clean compile time. The
# incremental rebuild after a one-file edit is unchanged (about 10 s).
[profile.dev.package.sparrow-core]
opt-level = 1

[profile.dev.package.sparrow-synth]
opt-level = 1

# Line tables only for our own code: panics and backtraces still show file:line, but the
# test binaries and target/ shrink by more than half (clean build 12.0 GB -> 5.2 GB; same build and
# test time).
[profile.dev]
debug = "line-tables-only"
